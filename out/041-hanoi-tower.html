<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tower of Hanoi · Nº 041</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#17201c;color:#e9e4d4;font-family:Georgia,"Iowan Old Style",serif}
body{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px}
header{text-align:center}
h1{font:italic 400 23px Georgia,serif}
h1 b{font-style:normal}
.tag{font:9px ui-monospace,Menlo,monospace;letter-spacing:.34em;text-transform:uppercase;color:#7f9070;margin-top:5px}
#c{cursor:pointer;touch-action:none}
.dock{display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:center}
button,select{font:11px Georgia,serif;padding:9px 14px;background:transparent;color:#e9e4d4;border:1px solid #6f8060;cursor:pointer}
button:hover{background:#e9e4d4;color:#17201c}
#stats{font:10px ui-monospace,Menlo,monospace;letter-spacing:.16em;color:#b8c4a2}
#msg{font:italic 12px Georgia,serif;height:16px;color:#d8c27a;text-align:center}
@media(max-width:520px){h1{font-size:18px}}
</style>
</head>
<body>
<header><h1>Tower of <b>Hanoi</b></h1><p class="tag">Nº 041 · the monks near the end of time approve your optimism</p></header>
<canvas id="c"></canvas>
<p id="msg">grab the top ring of a peg and drop it on another — never a wide one on a narrow one</p>
<div class="dock">
<select id="nd"><option>3</option><option>5</option><option selected>6</option><option>7</option><option>8</option></select>
<button id="solve">show the monks’ way</button>
<button id="reset">begin again</button>
<span id="stats">MOVES 0 · MIN 63</span>
</div>
<script>
(function(){
"use strict";
var cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=0,H=0,D=1;
var N=6,pegs,hold=-1,holdFrom=-1,moves=0,solveQ=[],solveT=0,win=false;
var stats=document.getElementById('stats'),msg=document.getElementById('msg');
function hues(){return['#c94f4f','#d98e3f','#d8c27a','#7fa05e','#4f9b8f','#5b76b8','#8f5fb8','#c75f97']}
function reset(){
  N=+document.getElementById('nd').value;
  pegs=[[],[],[]];
  for(var i=N;i>=1;i--)pegs[0].push(i);
  moves=0;hold=-1;solveQ=[];win=false;
  stats.textContent='MOVES 0 · MIN '+(Math.pow(2,N)-1);
  msg.textContent='grab the top ring of a peg and drop it on another — never a wide one on a narrow one';
}
function fit(){
  D=Math.min(window.devicePixelRatio||1,2);
  W=Math.min(innerWidth-10,820);
  H=Math.min(innerHeight-190,460);
  H=Math.max(260,H);
  cv.style.width=W+'px';cv.style.height=H+'px';
  cv.width=W*D;cv.height=H*D;ctx.setTransform(D,0,0,D,0,0);
}
function pegX(i){return W*(0.2+i*0.3)}
function ringW(d){return W*0.05+d*(W*0.16/N)}
function ringH(){return Math.min(30,H*0.055)}
function baseY(){return H*0.82}
function draw(){
  ctx.fillStyle='#17201c';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#2a3a2e';
  ctx.fillRect(W*0.06,baseY(),W*0.88,10);
  var hs=hues(),i;
  for(i=0;i<3;i++){
    ctx.fillStyle='#57694a';
    ctx.fillRect(pegX(i)-5,H*0.3,10,baseY()-H*0.3);
  }
  for(i=0;i<3;i++){
    if(i===holdFrom&&hold>=0)continue;
    drawStack(i,pegs[i],-1);
  }
  if(hold>=0){
    var mh=(window._mp||{x:W/2,y:H/2});
    drawRing(hold,mh.x-ringW(hold)/2,mh.y-ringH()/2,true);
  }
  if(win){
    ctx.fillStyle='rgba(232,225,190,0.92)';
    ctx.font='italic '+Math.round(Math.min(42,W*0.06))+'px Georgia,serif';
    ctx.textAlign='center';
    ctx.fillText('the last ring settles…',W/2,H*0.16);
    ctx.textAlign='left';
  }
}
function drawStack(i,stack,lift){
  var hs=hues();
  for(var d=0;d<stack.length;d++){
    var w=ringW(stack[d]),h=ringH();
    var y=baseY()-h*(d+1)-(lift===d?60:0);
    drawRing(stack[d],pegX(i)-w/2,y,false);
  }
}
function drawRing(d,x,y,float){
  var hs=hues();
  var w=ringW(d),h=ringH();
  var g=ctx.createLinearGradient(x,y,x,y+h);
  g.addColorStop(0,hs[(d-1)%hs.length]);
  g.addColorStop(1,'#00000055');
  ctx.fillStyle=g;
  if(float){ctx.shadowColor='rgba(0,0,0,0.5)';ctx.shadowBlur=24}
  roundRect(x,y,w,h,h/2);
  ctx.fill();ctx.shadowBlur=0;
  ctx.strokeStyle='rgba(255,255,255,0.25)';
  roundRect(x+3,y+2,w-6,h-4,(h-4)/2);
  ctx.stroke();
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function pegAt(x){
  var best=-1,bd=1e9;
  for(var i=0;i<3;i++){
    var d=Math.abs(x-pegX(i));
    if(d<bd){bd=d;best=i}
  }
  return bd<W*0.16?best:-1;
}
cv.addEventListener('pointerdown',function(e){
  if(win||solveQ.length)return;
  var r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  if(y>H*0.25){
    var p=pegAt(x);
    if(p>=0&&pegs[p].length&&hold<0){hold=pegs[p].pop();holdFrom=p}
    else if(p>=0&&hold>=0){tryPlace(p)}
  }
  window._mp={x:x,y:y};
});
cv.addEventListener('pointermove',function(e){
  var r=cv.getBoundingClientRect();
  window._mp={x:e.clientX-r.left,y:e.clientY-r.top};
},{passive:true});
cv.addEventListener('pointerup',function(e){
  if(hold<0)return;
  var r=cv.getBoundingClientRect();
  var p=pegAt(e.clientX-r.left);
  if(p>=0&&p!==holdFrom)tryPlace(p);
  else if(p===holdFrom)tryPlace(p);
  else{pegs[holdFrom].push(hold);hold=-1;holdFrom=-1}
});
function tryPlace(p){
  var top=pegs[p].length?pegs[p][pegs[p].length-1]:1e9;
  if(hold<top){
    if(p!==holdFrom){moves++;stats.textContent='MOVES '+moves+' · MIN '+(Math.pow(2,N)-1)}
    pegs[p].push(hold);
    hold=-1;holdFrom=-1;
    check();
  }else{
    msg.textContent='the monks wince — ‘'+hold+'’ cannot sit on ‘'+top+'’.';
    setTimeout(function(){if(!win)msg.textContent='grab the top ring of a peg and drop it on another — never a wide one on a narrow one'},1400);
  }
}
function check(){
  if(pegs[2].length===N){
    win=true;
    msg.textContent='perfect in '+moves+' moves'+(moves===Math.pow(2,N)-1?' — the minimum! the universe is one step closer to ending.':' — the monks note inefficiency (min '+(Math.pow(2,N)-1)+').');
  }
}
function plan(n,from,to,via){
  if(n===0)return;
  plan(n-1,from,via,to);
  solveQ.push([from,to]);
  plan(n-1,via,to,from);
}
document.getElementById('solve').addEventListener('click',function(){
  if(win||hold>=0)return;
  solveQ=[];
  var src=-1;
  for(var i=0;i<3;i++)if(pegs[i].length===N)src=i;
  if(src<0)src=pegs[0].length?0:(pegs[1].length?1:2);
  var dst=src===2?0:2;
  N=pegs[src].length;
  plan(N,src,dst,3-src-dst);
  stepQ();
});
function stepQ(){
  if(!solveQ.length)return;
  var mv=solveQ.shift();
  var d=pegs[mv[0]].pop();
  if(d===undefined){return}
  pegs[mv[1]].push(d);
  moves++;stats.textContent='MOVES '+moves+' · MIN '+(Math.pow(2,N)-1);
  draw();
  if(pegs[2].length===N){check();return}
  solveT=setTimeout(stepQ,Math.max(60,420-N*35));
}
document.getElementById('reset').addEventListener('click',function(){clearTimeout(solveT);reset()});
document.getElementById('nd').addEventListener('change',function(){clearTimeout(solveT);reset()});
window.addEventListener('resize',function(){fit();draw()});
fit();reset();
(function loop(){draw();requestAnimationFrame(loop)})();
})();
</script>
</body>
</html>
