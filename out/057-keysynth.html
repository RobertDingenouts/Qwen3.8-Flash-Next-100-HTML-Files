<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Key Synth · Nº 057</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#17131f;color:#f0e8fa;font-family:"Century Gothic",Futura,Avenir,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px}
header{text-align:center}
h1{font-size:12px;letter-spacing:.4em;text-transform:uppercase;font-weight:400}
h1 b{color:#c77dff}
.tag{font:8px ui-monospace,Menlo,monospace;letter-spacing:.28em;text-transform:uppercase;color:#6a5f80;margin-top:5px}
#scope{border-radius:8px;background:#0e0b14}
#keys{cursor:pointer;touch-action:none}
.dock{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center}
label{font-size:8px;letter-spacing:.2em;text-transform:uppercase;display:flex;gap:7px;align-items:center}
select{background:#241d33;color:#f0e8fa;border:1px solid #453a5e;padding:7px;font:10px ui-monospace,monospace}
input[type=range]{width:80px;accent-color:#c77dff}
.hint{font-size:8px;letter-spacing:.2em;text-transform:uppercase;opacity:.45}
@media(max-width:520px){.hint{display:none}}
</style>
</head>
<body>
<header><h1>Key <b>Synth</b></h1><p class="tag">Nº 057 · your keyboard is now an instrument · Z–M and Q–U are the keys</p></header>
<canvas id="scope"></canvas>
<canvas id="keys"></canvas>
<div class="dock">
<label>wave <select id="wave"><option>sine</option><option>triangle</option><option>sawtooth</option><option>square</option></select></label>
<label>echo <input id="echo" type="range" min="0" max="90" value="35"></label>
<label>octave <input id="oct" type="range" min="2" max="5" value="4"></label>
<label>release <input id="rel" type="range" min="5" max="120" value="25"></label>
<span class="hint">hold multiple keys for chords</span>
</div>
<script>
(function(){
"use strict";
var D=Math.min(window.devicePixelRatio||1,2);
var sc=document.getElementById('scope'),sctx=sc.getContext('2d');
var kv=document.getElementById('keys'),kctx=kv.getContext('2d');
var SW=0,SS=0,KW=0,KH=0;
var AC=null,master,delay,fb,analyser,ndata;
var voices={},oct=4,wave='sine',rel=0.25;
var ROWS=[['KeyZ',0],['KeyS',1],['KeyX',2],['KeyD',3],['KeyC',4],['KeyV',5],['KeyG',6],
['KeyB',7],['KeyH',8],['KeyN',9],['KeyJ',10],['KeyM',11],['KeyQ',12],['Digit2',13],
['KeyW',14],['Digit3',15],['KeyE',16],['KeyR',17],['Digit5',18],['KeyT',19],['Digit6',20],
['KeyY',21],['Digit7',22],['KeyU',23],['KeyI',24],['Digit9',25],['KeyO',26],['Digit0',27],['KeyP',28]];
var LABELS=['Z','S','X','D','C','V','G','B','H','N','J','M','Q','2','W','3','E','R','5','T','6','Y','7','U','I','9','O','0','P'];
var pressed={};
function fit(){
  SW=Math.min(innerWidth-10,640);SS=Math.min(90,innerHeight*0.12);
  KW=SW;KH=Math.min(120,innerHeight*0.16);
  sc.style.width=SW+'px';sc.style.height=SS+'px';sc.width=SW*D;sc.height=SS*D;
  kv.style.width=KW+'px';kv.style.height=KH+'px';kv.width=KW*D;kv.height=KH*D;
}
function ac(){
  if(AC)return AC;
  AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain();master.gain.value=0.4;
  analyser=AC.createAnalyser();analyser.fftSize=2048;
  ndata=new Float32Array(analyser.fftSize);
  delay=AC.createDelay(1);delay.delayTime.value=0.28;
  fb=AC.createGain();fb.gain.value=0.35;
  var wet=AC.createGain();wet.gain.value=+document.getElementById('echo').value/100;
  delay.connect(fb);fb.connect(delay);
  delay.connect(wet);wet.connect(master);
  master.connect(analyser);analyser.connect(AC.destination);
  window._wet=wet;
  return AC;
}
function freq(semi){return 440*Math.pow(2,(semi-9)/12)}
function noteIdx(code){
  for(var i=0;i<ROWS.length;i++)if(ROWS[i][0]===code)return i;
  return -1;
}
function on(idx){
  if(voices[idx])return;
  ac();if(AC.state==='suspended')AC.resume();
  var semi=idx+(oct-4)*12;
  var o=AC.createOscillator(),g=AC.createGain();
  o.type=wave;o.frequency.value=freq(semi);
  var t=AC.currentTime;
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(0.22,t+0.02);
  g.gain.exponentialRampToValueAtTime(0.12,t+0.25);
  o.connect(g);g.connect(master);g.connect(delay);
  o.start(t);
  voices[idx]={o:o,g:g};
  pressed[idx]=1;
}
function off(idx){
  var v=voices[idx];
  if(!v)return;
  delete voices[idx];
  pressed[idx]=0;
  var t=AC.currentTime;
  v.g.gain.cancelScheduledValues(t);
  v.g.gain.setValueAtTime(Math.max(0.001,v.g.gain.value),t);
  v.g.gain.exponentialRampToValueAtTime(0.0001,t+rel);
  v.o.stop(t+rel+0.05);
}
window.addEventListener('keydown',function(e){
  if(e.repeat)return;
  var i=noteIdx(e.code);
  if(i>=0){e.preventDefault();on(i)}
});
window.addEventListener('keyup',function(e){
  var i=noteIdx(e.code);
  if(i>=0)off(i);
});
kv.addEventListener('pointerdown',function(e){
  var i=keyAt(e);
  if(i>=0){on(i);
    var up=function(){off(i);window.removeEventListener('pointerup',up)};
    window.addEventListener('pointerup',up);
  }
});
function keyAt(e){
  var r=kv.getBoundingClientRect();
  var x=e.clientX-r.left,y=e.clientY-r.top;
  var bw=KW/14;
  var col=Math.floor(x/bw);
  if(col<0||col>=14)return -1;
  return col+(y<KH/2?14:0);
}
function drawKeys(){
  kctx.setTransform(D,0,0,D,0,0);
  kctx.clearRect(0,0,KW,KH);
  var bw=KW/14;
  for(var i=0;i<29;i++){
    var top=i>=14;
    var idx=top?i-14:i;
    var x=(idx%14)*bw,y=top?0:KH/2;
    var black=[1,3,6,8,10,13,15,18,20,22,25,27].indexOf(i)>=0;
    var on2=pressed[i];
    kctx.fillStyle=on2?'#c77dff':(black?'#241d33':'#efe8fa');
    kctx.strokeStyle='#453a5e';
    roundRect(x+1,y+1,bw-2,KH/2-2,4);
    kctx.fill();kctx.stroke();
    if(on2){kctx.shadowColor='#c77dff';kctx.shadowBlur=18;roundRect(x+1,y+1,bw-2,KH/2-2,4);kctx.fill();kctx.shadowBlur=0}
    kctx.fillStyle=on2?'#17131f':(black?'#6a5f80':'#453a5e');
    kctx.font='700 9px ui-monospace,monospace';
    kctx.textAlign='center';
    kctx.fillText(LABELS[i],x+bw/2,y+KH/2-12);
  }
  kctx.textAlign='left';
}
function roundRect(x,y,w,h,r){
  kctx.beginPath();
  kctx.moveTo(x+r,y);kctx.arcTo(x+w,y,x+w,y+h,r);
  kctx.arcTo(x+w,y+h,x,y+h,r);kctx.arcTo(x,y+h,x,y,r);kctx.arcTo(x,y,x+w,y,r);
  kctx.closePath();
}
function scope(){
  sctx.setTransform(D,0,0,D,0,0);
  sctx.fillStyle='rgba(14,11,20,0.35)';
  sctx.fillRect(0,0,SW,SS);
  if(analyser){
    analyser.getFloatTimeDomainData(ndata);
    sctx.strokeStyle='#7bffd4';
    sctx.lineWidth=1.6;
    sctx.shadowColor='#7bffd4';sctx.shadowBlur=8;
    sctx.beginPath();
    var first=true;
    for(var i=0;i<ndata.length;i+=Math.ceil(ndata.length/SW)){
      var x=i/ndata.length*SW;
      var y=SS/2-ndata[i]*SS*0.9;
      if(first){sctx.moveTo(x,y);first=false}else sctx.lineTo(x,y);
    }
    sctx.stroke();sctx.shadowBlur=0;
  }
  drawKeys();
  requestAnimationFrame(scope);
}
document.getElementById('wave').addEventListener('change',function(e){wave=e.target.value});
document.getElementById('echo').addEventListener('input',function(e){if(window._wet)_wet.gain.value=+e.target.value/100});
document.getElementById('oct').addEventListener('input',function(e){oct=+e.target.value});
document.getElementById('rel').addEventListener('input',function(e){rel=+e.target.value/100});
window.addEventListener('resize',fit);
fit();requestAnimationFrame(scope);
})();
</script>
</body>
</html>
