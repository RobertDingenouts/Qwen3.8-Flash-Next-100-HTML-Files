<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dice Tray · Nº 099</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#1d140d;color:#e8dcc2;font-family:Georgia,"Iowan Old Style",serif}
body{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px}
header{text-align:center}
h1{font:italic 400 22px Georgia,serif;color:#c98f4a}
.tag{font:8px ui-monospace,Menlo,monospace;letter-spacing:.3em;text-transform:uppercase;color:#8a6f46;margin-top:4px}
#tray{border-radius:14px;
background:
 repeating-linear-gradient(92deg,rgba(0,0,0,0.08) 0 3px,transparent 3px 9px),
 repeating-linear-gradient(88deg,rgba(255,255,255,0.04) 0 2px,transparent 2px 7px),
 linear-gradient(#8a5a2c,#6b431f 60%,#573517);
box-shadow:inset 0 6px 22px rgba(0,0,0,0.55),inset 0 -3px 10px rgba(0,0,0,0.5),0 16px 40px -14px rgba(0,0,0,0.7);
border:8px solid #4a2d14}
canvas{touch-action:manipulation;cursor:pointer;border-radius:8px}
.bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center}
button{font:700 9px Georgia,serif;letter-spacing:.1em;padding:9px 11px;background:transparent;
border:1px solid #8a6f46;color:#e8dcc2;cursor:pointer;border-radius:4px}
button:hover{background:#c98f4a;color:#1d140d}
#total{font:700 20px ui-monospace,Menlo,monospace;color:#ffd27a;min-width:80px;text-align:right}
</style>
</head>
<body>
<header><h1>Dice Tray</h1><p class="tag">Nº 099 · ivory, walnut, and the old quarrel with chance</p></header>
<canvas id="tray"></canvas>
<div class="bar">
<button data-d="4">+d4</button><button data-d="6">+d6</button><button data-d="8">+d8</button>
<button data-d="12">+d12</button><button data-d="20">+d20</button>
<button id="roll">roll all</button>
<button id="sweep">sweep tray</button>
<span id="total">Σ 0</span>
</div>
<script>
(function(){
"use strict";
var cv=document.getElementById('tray'),ctx=cv.getContext('2d'),D=1,W=0,H=0;
var dice=[],dragDie=null;
function polyN(d){return d.f===4?3:(d.f===6?4:(d.f===8?4:(d.f===12?5:6)))}
function addDie(f){
 if(dice.length>=14)return;
 dice.push({f:f,x:W*(0.2+Math.random()*0.6),y:H*(0.2+Math.random()*0.6),
  vx:0,vy:0,a:Math.random()*7,va:0,r:18+Math.random()*6,val:1+((Math.random()*f)|0),
  col:['#f2ead6','#e8ddc4','#efe3cc'][(Math.random()*3)|0],rolling:0});
}
function fit(){D=Math.min(devicePixelRatio||1,2);
 W=Math.min(innerWidth-20,760);H=Math.min(innerHeight-190,430);
 cv.style.width=W+'px';cv.style.height=H+'px';
 cv.width=W*D;cv.height=H*D;ctx.setTransform(D,0,0,D,0,0)}
function rollAll(){
 dice.forEach(function(d){
  d.vx=(Math.random()-0.5)*16;
  d.vy=(Math.random()-0.5)*16;
  d.va=(Math.random()-0.5)*0.6;
  d.rolling=1;
  d.val=1+((Math.random()*d.f)|0);
 });
}
function physics(){
 dice.forEach(function(d){
  d.x+=d.vx;d.y+=d.vy;d.a+=d.va;
  d.vx*=0.985;d.vy*=0.985;d.va*=0.97;
  var m=d.r;
  if(d.x<m){d.x=m;d.vx=Math.abs(d.vx)*0.7}
  if(d.x>W-m){d.x=W-m;d.vx=-Math.abs(d.vx)*0.7}
  if(d.y<m){d.y=m;d.vy=Math.abs(d.vy)*0.7}
  if(d.y>H-m){d.y=H-m;d.vy=-Math.abs(d.vy)*0.7}
 });
 for(var i=0;i<dice.length;i++)for(var j=i+1;j<dice.length;j++){
  var a=dice[i],b=dice[j];
  var dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),min=a.r+b.r-4;
  if(d<min&&d>0){
   var p=(min-d)/2,ux=dx/d,uy=dy/d;
   a.x-=ux*p;a.y-=uy*p;b.x+=ux*p;b.y+=uy*p;
   var rel=(b.vx-a.vx)*ux+(b.vy-a.vy)*uy;
   if(rel<0){
    b.vx-=ux*rel*0.5;b.vy-=uy*rel*0.5;
    a.vx+=ux*rel*0.5;a.vy+=uy*rel*0.5;
   }
  }
 }
 var moving=false;
 dice.forEach(function(d){
  if(Math.abs(d.vx)+Math.abs(d.vy)>0.3||Math.abs(d.va)>0.02){d.rolling=1;moving=true}
  else d.rolling=0;
 });
 return moving;
}
function draw(){
 ctx.clearRect(0,0,W,H);
 var tot=0;
 dice.forEach(function(d){
  ctx.save();
  ctx.translate(d.x,d.y);ctx.rotate(d.a);
  var n=polyN(d);
  ctx.beginPath();
  for(var k=0;k<n;k++){
   var a=k/n*Math.PI*2-Math.PI/2;
   var x=Math.cos(a)*d.r,y=Math.sin(a)*d.r;
   k?ctx.lineTo(x,y):ctx.moveTo(x,y);
  }
  ctx.closePath();
  var g=ctx.createRadialGradient(-d.r*0.3,-d.r*0.3,0,0,0,d.r*1.3);
  g.addColorStop(0,d.col);g.addColorStop(1,'#a89a7c');
  ctx.fillStyle=g;ctx.fill();
  ctx.strokeStyle='#3a2c16';ctx.lineWidth=2;ctx.stroke();
  ctx.rotate(-d.a*0.8);
  ctx.fillStyle='#2a1c0c';
  ctx.font='700 '+(d.r*0.8)+'px Georgia,serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(d.rolling?'?':d.val,0,2);
  ctx.restore();
  if(!d.rolling)tot+=d.val;
 });
 document.getElementById('total').textContent='Σ '+(dice.some(function(d){return d.rolling})?'…':tot);
}
function loop(){
 physics();
 draw();
 requestAnimationFrame(loop);
}
cv.addEventListener('pointerdown',function(e){
 var r=cv.getBoundingClientRect();
 var x=e.clientX-r.left,y=e.clientY-r.top;
 var bd=1e9;
 dice.forEach(function(d){
  var dist=Math.hypot(d.x-x,d.y-y);
  if(dist<d.r+6&&dist<bd){bd=dist;dragDie=d}
 });
 if(dragDie){
  dragDie.x=x;dragDie.y=y;dragDie.vx=0;dragDie.vy=0;
  var lx=x,ly=y;
  var mv=function(ev){
   var nx=ev.clientX-r.left,ny=ev.clientY-r.top;
   dragDie.vx=(nx-lx)*1.2;dragDie.vy=(ny-ly)*1.2;
   dragDie.x=nx;dragDie.y=ny;lx=nx;ly=ny;
  };
  var up=function(){
   window.removeEventListener('pointermove',mv);
   window.removeEventListener('pointerup',up);
   dragDie.va=(Math.random()-0.5)*0.5;
   dragDie.rolling=1;
   dragDie.val=1+((Math.random()*dragDie.f)|0);
   dragDie=null;
  };
  window.addEventListener('pointermove',mv);
  window.addEventListener('pointerup',up);
 }
});
document.querySelectorAll('[data-d]').forEach(function(b){
 b.addEventListener('click',function(){addDie(+b.dataset.d)});
});
document.getElementById('roll').addEventListener('click',rollAll);
document.getElementById('sweep').addEventListener('click',function(){dice=[]});
window.addEventListener('resize',fit);
fit();addDie(6);addDie(20);rollAll();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
