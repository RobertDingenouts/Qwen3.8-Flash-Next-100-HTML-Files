<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Keystroke · Nº 063</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#f7f6f1;color:#222;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:16px}
header{text-align:center}
h1{font-size:11px;font-weight:400;letter-spacing:.44em;text-transform:uppercase}
h1 b{color:#c33}
.tag{font-size:8px;letter-spacing:.28em;text-transform:uppercase;color:#9a968c;margin-top:5px}
#stats{display:flex;gap:30px}
.st{text-align:center}
.st b{font-size:30px;display:block;font-weight:700}
.st span{font-size:8px;letter-spacing:.26em;text-transform:uppercase;color:#9a968c}
#words{max-width:min(760px,94vw);font-size:22px;line-height:1.8;text-align:left;color:#b8b4a8;
position:relative;min-height:110px;outline:none}
#words .w{padding:1px 0;border-bottom:2px solid transparent}
#words .w.ok{color:#222}
#words .w.bad{color:#c33;background:rgba(204,51,51,0.08)}
#words .w.cur{border-bottom:2px solid #222;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{border-color:transparent}}
#typed{position:absolute;left:-9999px}
canvas{opacity:.9}
.dock{display:flex;gap:8px}
button{font:700 8px ui-monospace,monospace;letter-spacing:.2em;text-transform:uppercase;padding:11px 15px;
background:transparent;border:1px solid #b8b4a8;color:#222;cursor:pointer}
button:hover{background:#222;color:#f7f6f1}
#endmsg{font-size:11px;height:14px;color:#c33;letter-spacing:.1em}
@media(max-width:560px){#words{font-size:16px}.st b{font-size:20px}}
</style>
</head>
<body>
<header><h1>key<b>stroke</b></h1><p class="tag">Nº 063 · thirty seconds, honest fingers</p></header>
<div id="stats">
<div class="st"><b id="wpm">0</b><span>wpm</span></div>
<div class="st"><b id="acc">100</b><span>accuracy</span></div>
<div class="st"><b id="clk">30</b><span>seconds</span></div>
</div>
<div id="words"></div>
<input id="typed" autocomplete="off" autocapitalize="off" spellcheck="false">
<canvas id="spark" width="300" height="50"></canvas>
<div class="dock"><button id="restart">restart ⌫</button></div>
<p id="endmsg"></p>
<script>
(function(){
"use strict";
var WORDS="the quick brown fox jumps over lazy dogs and I saw five dozen liquor jugs pack my box with wax time hack zigzag glyph vex lyric judge myth vapor waltz tuxedo sphinx kayak quilt zephyr oxford gauntlet jazz maze fjord bronze grumpy equinox snowdrift velvet tundra prism anchor cinder marlin puzzle grotto nimbus quartz wizard yonder beacon thicket meadow harbor willow lantern cobweb drizzle echo field frost glade island jungle ketchup lemon magnet ocean pocket quill ribbon sailor timber umbrella violin walnut xylophone yarn zipper".split(' ');
var N=48,seq=[],idx=0,errs=0,tot=0,started=0,total=30,done=false,spark=[],timer=null,lastWpm=0;
var wd=document.getElementById('words'),ti=document.getElementById('typed');
function fill(){
  seq=[];wd.innerHTML='';
  for(var i=0;i<N;i++){
    var w=WORDS[(Math.random()*WORDS.length)|0];
    seq.push(w);
    var s=document.createElement('span');s.className='w';s.textContent=w+' ';
    wd.appendChild(s);
  }
  mark();
}
function mark(){
  var ws=wd.children;
  for(var i=0;i<ws.length;i++)ws[i].className='w'+(i<idx?' ok':'')+(i===idx?' cur':'');
  var last=wd.children[idx-1];
  if(idx>0){
    var typedLast=last.dataset.t||'';
    if(typedLast&&typedLast!==seq[idx-1]){
      last.className='w bad';
    }else last.className='w ok';
  }
}
function reset(){
  clearInterval(timer);timer=null;
  idx=0;errs=0;tot=0;started=0;done=false;spark=[];lastWpm=0;
  document.getElementById('endmsg').textContent='';
  document.getElementById('clk').textContent=total;
  document.getElementById('wpm').textContent=0;
  document.getElementById('acc').textContent=100;
  fill();
  ti.value='';ti.focus();
}
function tickSec(){
  if(!started)return;
  var left=Math.max(0,total-(Date.now()-started)/1000);
  document.getElementById('clk').textContent=Math.ceil(left);
  var mins=(Date.now()-started)/60000;
  var wpm=mins>0.05?Math.round((tot-mins*0)/mins*1):0;
  wpm=Math.round((tot/5)/Math.max(0.02,mins));
  lastWpm=wpm;
  document.getElementById('wpm').textContent=wpm;
  spark.push(wpm);drawSpark();
  if(left<=0)finish();
}
function finish(){
  done=true;clearInterval(timer);timer=null;
  document.getElementById('wpm').textContent=lastWpm;
  document.getElementById('endmsg').textContent=
    lastWpm>90?'keyboardist. call the orchestra.':
    lastWpm>60?'genuine velocity, mostly honest.':
    lastWpm>35?'comfortable commuter typing.':'the keys and you are still getting acquainted.';
}
ti.addEventListener('input',function(){
  if(done)return;
  if(!started){started=Date.now();timer=setInterval(tickSec,250)}
  var v=ti.value;
  if(v.endsWith(' ')){
    var word=v.trim();
    var target=seq[idx];
    tot++;
    if(word!==target){errs++;}
    wd.children[idx].dataset.t=word;
    idx++;ti.value='';
    mark();
    if(idx>=N){finish();return}
  }
});
function drawSpark(){
  var sc=document.getElementById('spark'),x=sc.getContext('2d');
  var D=Math.min(devicePixelRatio||1,2);
  var W=sc.width,H=sc.height;
  x.clearRect(0,0,W,H);
  var mc=Math.max(60,Math.max.apply(null,spark));
  x.strokeStyle='#c33';x.lineWidth=1.6*D;
  x.beginPath();
  for(var i=0;i<spark.length;i++){
    var px=i/Math.max(1,spark.length-1)*W;
    var py=H-spark[i]/mc*(H-6)-3;
    i?x.lineTo(px,py):x.moveTo(px,py);
  }
  x.stroke();
}
document.getElementById('restart').addEventListener('click',reset);
wd.addEventListener('click',function(){ti.focus()});
reset();
})();
</script>
</body>
</html>
