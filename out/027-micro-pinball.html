<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Micro Pinball · Nº 027</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#0b0f1e;color:#f4e7c3;font-family:"Trebuchet MS",Verdana,sans-serif}
body{display:flex;align-items:center;justify-content:center;gap:14px;padding:8px}
#side{display:flex;flex-direction:column;gap:12px;width:130px}
h1{font-size:11px;letter-spacing:.3em;text-transform:uppercase}
h1 b{color:#f5c542}
.stat{font-size:9px;letter-spacing:.26em;text-transform:uppercase}
.stat b{display:block;font:700 22px ui-monospace,Menlo,monospace;color:#f5c542;letter-spacing:0}
#ballsi{letter-spacing:.4em;color:#f5c542;font-size:14px}
#log{font-size:9px;letter-spacing:.14em;opacity:.75;line-height:1.8;min-height:66px}
button{font:700 9px "Trebuchet MS";letter-spacing:.2em;text-transform:uppercase;padding:11px;background:#1b2340;color:#f4e7c3;border:1px solid rgba(245,197,66,.25);cursor:pointer;border-radius:3px}
button:hover{background:#f5c542;color:#0b0f1e}
.hint{font-size:8px;letter-spacing:.14em;opacity:.5;text-transform:uppercase}
canvas{border-radius:10px;touch-action:none}
@media(max-width:640px){#side{width:104px}#log{display:none}}
@media(max-width:430px){#side{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="side">
<h1>Micro <b>Pinball</b></h1>
<div class="stat">score<b id="sc">0</b></div>
<div class="stat">balls <span id="ballsi">●●●</span></div>
<div id="log">hold SPACE (or tap upper right) to draw the plunger…</div>
<button id="new">new game</button>
<p class="hint">flippers: ←/→ or A/L · touch lower corners</p>
</div>
<script>
(function(){
"use strict";
var VW=360,VH=620;
var cv=document.getElementById('c'),ctx=cv.getContext('2d');
var sc=1,D=1;
var segs=[],bumps=[],ball=null,balls=3,score=0,combo=1,comboT=0,restT=0;
var Lp={a:0.55,t:0.55},Rp={a:-0.55,t:-0.55};
var launch={power:0,held:false,ready:true};
var logEl=document.getElementById('log'),scEl=document.getElementById('sc'),ballsi=document.getElementById('ballsi');
function seg(x1,y1,x2,y2){segs.push([x1,y1,x2,y2])}
function build(){
  segs=[];
  bumps=[
    {x:120,y:180,r:22,flash:0},{x:210,y:140,r:22,flash:0},{x:250,y:250,r:20,flash:0},
    {x:95,y:300,r:16,flash:0}
  ];
  seg(40,140,40,470);seg(40,470,105,540);seg(105,540,132,556);
  seg(18,140,18,560);seg(18,560,120,590);seg(120,590,142,565);
  seg(320,180,320,560);seg(342,140,342,585);seg(342,585,255,595);seg(255,595,232,565);
  seg(40,140,110,60);seg(110,60,260,64);seg(260,64,320,180);
  seg(120,380,148,452);seg(148,452,96,440);seg(96,440,120,380);
  seg(280,380,252,452);seg(252,452,304,440);seg(304,440,280,380);
  seg(318,576,344,576);
}
function newBall(){
  ball={x:331,y:566,vx:0,vy:0,r:8};
  launch.ready=true;launch.power=0;launch.held=false;restT=0;
  balls--;paintBalls();
}
function paintBalls(){var s='';for(var i=0;i<balls;i++)s+='●';ballsi.textContent=s||'—'}
function addScore(n,what){
  score+=n*combo;scEl.textContent=score;
  logEl.textContent=what+' +'+n*combo+(combo>1?' (×'+combo+')':'');
  comboT=120;combo=Math.min(8,combo+(n>=50?1:0));
}
function fit(){
  D=Math.min(window.devicePixelRatio||1,2);
  var availH=innerHeight-16,availW=innerWidth-(innerWidth>640?170:16);
  sc=Math.min(availH/VH,availW/VW);
  var w=Math.round(VW*sc),h=Math.round(VH*sc);
  cv.style.width=w+'px';cv.style.height=h+'px';
  cv.width=w*D;cv.height=h*D;
}
function collSeg(b,s){
  var x1=s[0],y1=s[1],x2=s[2],y2=s[3];
  var dx=x2-x1,dy=y2-y1,len2=dx*dx+dy*dy;
  if(len2===0)return false;
  var t=((b.x-x1)*dx+(b.y-y1)*dy)/len2;t=Math.max(0,Math.min(1,t));
  var cx=x1+dx*t,cy=y1+dy*t;
  var nx=b.x-cx,ny=b.y-cy,dist=Math.hypot(nx,ny);
  if(dist>=b.r||dist===0)return false;
  nx/=dist;ny/=dist;
  b.x=cx+nx*b.r;b.y=cy+ny*b.r;
  var vn=b.vx*nx+b.vy*ny;
  if(vn<0){b.vx-=1.5*vn*nx;b.vy-=1.5*vn*ny;return true}
  return false;
}
function flipPts(f,right){
  var piv=right?{x:232,y:556}:{x:132,y:556};
  var a=right?(Math.PI+f.a):f.a;
  var tip={x:piv.x+Math.cos(a)*62,y:piv.y+Math.sin(a)*62};
  return{piv:piv,tip:tip,a:a};
}
function collFlipper(b,fp,piv){
  var p1=fp.piv,p2=fp.tip;
  var dx=p2.x-p1.x,dy=p2.y-p1.y,len2=dx*dx+dy*dy;
  var t=((b.x-p1.x)*dx+(b.y-p1.y)*dy)/len2;t=Math.max(0,Math.min(1,t));
  var cx=p1.x+dx*t,cy=p1.y+dy*t;
  var nx=b.x-cx,ny=b.y-cy,dist=Math.hypot(nx,ny);
  if(dist>=b.r+4||dist===0)return false;
  nx/=dist;ny/=dist;
  b.x=cx+nx*(b.r+4);b.y=cy+ny*(b.r+4);
  var rx=cx-p1.x,ry=cy-p1.y;
  var omega=(piv===0?Lp.s:Rp.s)||0;
  var vsx=-omega*ry,vsy=omega*rx;
  var rvx=b.vx-vsx,rvy=b.vy-vsy;
  var vn=rvx*nx+rvy*ny;
  if(vn<0){rvx-=1.7*vn*nx;rvy-=1.7*vn*ny}
  b.vx=rvx+vsx;b.vy=rvy+vsy;
  return true;
}
function step(){
  if(!ball)return;
  if(launch.held&&launch.ready){launch.power=Math.min(1,launch.power+0.016)}
  if(launch.ready&&!launch.held&&launch.power>0.05){
    ball.vy=-(9.5+launch.power*9);launch.ready=false;launch.power=0;
  }
  ball.vy+=0.21;
  var sp=Math.hypot(ball.vx,ball.vy);
  if(sp>13){ball.vx*=13/sp;ball.vy*=13/sp}
  ball.x+=ball.vx;ball.y+=ball.vy;
  ball.vx*=0.999;
  for(var i=0;i<segs.length;i++)collSeg(ball,segs[i]);
  var prevL=Lp.a,prevR=Rp.a;
  Lp.a+=(Lp.t-Lp.a)*0.45;Rp.a+=(Rp.t-Rp.a)*0.45;
  Lp.s=Lp.a-prevL;Rp.s=Rp.a-prevR;
  var L=flipPts(Lp,false),R=flipPts(Rp,true);
  collFlipper(ball,L,0);collFlipper(ball,R,1);
  for(var b2=0;b2<bumps.length;b2++){var bp=bumps[b2];
    if(bp.flash>0)bp.flash--;
    var dx=ball.x-bp.x,dy=ball.y-bp.y,d=Math.hypot(dx,dy);
    if(d<bp.r+ball.r){
      var nx=dx/d,ny=dy/d;
      ball.x=bp.x+nx*(bp.r+ball.r);ball.y=bp.y+ny*(bp.r+ball.r);
      var vn=ball.vx*nx+ball.vy*ny;
      ball.vx=nx*Math.max(5.5,-vn*1.2);ball.vy=ny*Math.max(5.5,-vn*1.2);
      bp.flash=10;addScore(50,'bumper!');
    }
  }
  if(ball.y>VH+24){
    ball=null;logEl.textContent='ball drained…';combo=1;
    if(balls>0)setTimeout(newBall,900);else logEl.textContent='GAME OVER — new game?';
  }else if(Math.hypot(ball.vx,ball.vy)<0.25){
    restT++;
    if(restT>110){ball=null;combo=1;logEl.textContent='ball went to sleep — drained';
      if(balls>0)setTimeout(newBall,900);else logEl.textContent='GAME OVER — new game?'}
  }else restT=0;
  if(comboT>0)comboT--;else combo=1;
}
function draw(){
  ctx.setTransform(D*sc,0,0,D*sc,0,0);
  var g=ctx.createLinearGradient(0,0,0,VH);
  g.addColorStop(0,'#141a35');g.addColorStop(1,'#0b0f1e');
  ctx.fillStyle=g;ctx.fillRect(0,0,VW,VH);
  ctx.strokeStyle='rgba(245,197,66,0.4)';ctx.lineWidth=3;ctx.lineCap='round';
  ctx.beginPath();
  segs.forEach(function(s){ctx.moveTo(s[0],s[1]);ctx.lineTo(s[2],s[3])});
  ctx.shadowColor='rgba(245,197,66,0.35)';ctx.shadowBlur=6;ctx.stroke();ctx.shadowBlur=0;
  bumps.forEach(function(bp){
    ctx.strokeStyle=bp.flash>0?'#fff':'#4dd2ff';
    ctx.lineWidth=bp.flash>0?4:2.5;
    ctx.shadowColor='#4dd2ff';ctx.shadowBlur=bp.flash>0?24:10;
    ctx.beginPath();ctx.arc(bp.x,bp.y,bp.r,0,7);ctx.stroke();
    ctx.fillStyle=bp.flash>0?'rgba(255,255,255,0.25)':'rgba(77,210,255,0.08)';
    ctx.fill();ctx.shadowBlur=0;
    ctx.fillStyle='rgba(77,210,255,0.4)';ctx.beginPath();ctx.arc(bp.x,bp.y,4,0,7);ctx.fill();
  });
  [Lp,Rp].forEach(function(f,i){
    var fp=flipPts(f,i===1);
    ctx.strokeStyle='#ff5b7f';ctx.lineWidth=11;ctx.lineCap='round';
    ctx.shadowColor='#ff5b7f';ctx.shadowBlur=12;
    ctx.beginPath();ctx.moveTo(fp.piv.x,fp.piv.y);ctx.lineTo(fp.tip.x,fp.tip.y);ctx.stroke();
    ctx.shadowBlur=0;
    ctx.fillStyle='#f4e7c3';ctx.beginPath();ctx.arc(fp.piv.x,fp.piv.y,5,0,7);ctx.fill();
  });
  ctx.strokeStyle='rgba(245,197,66,0.5)';ctx.lineWidth=8;
  ctx.beginPath();ctx.moveTo(331,572);ctx.lineTo(331,572-launch.power*52);ctx.stroke();
  if(ball){
    var bg=ctx.createRadialGradient(ball.x-3,ball.y-3,1,ball.x,ball.y,10);
    bg.addColorStop(0,'#ffffff');bg.addColorStop(1,'#9aa7c8');
    ctx.fillStyle=bg;
    ctx.shadowColor='rgba(255,255,255,0.6)';ctx.shadowBlur=12;
    ctx.beginPath();ctx.arc(ball.x,ball.y,8,0,7);ctx.fill();ctx.shadowBlur=0;
  }else if(balls>0){
    ctx.fillStyle='#f5c542';ctx.font='14px monospace';ctx.textAlign='center';
    ctx.fillText('press launch',331,520);ctx.textAlign='left';
  }
}
function flipL(on){Lp.t=on?-0.55:0.55}
function flipR(on){Rp.t=on?0.55:-0.55}
window.addEventListener('keydown',function(e){
  var k=e.key.toLowerCase();
  if(k==='arrowleft'||k==='a'){e.preventDefault();flipL(1)}
  if(k==='arrowright'||k==='d'){e.preventDefault();flipR(1)}
  if(k===' '){e.preventDefault();if(!ball&&balls>0){newBall()}launch.held=true}
});
window.addEventListener('keyup',function(e){
  var k=e.key.toLowerCase();
  if(k==='arrowleft'||k==='a')flipL(0);
  if(k==='arrowright'||k==='d')flipR(0);
  if(k===' ')launch.held=false;
});
cv.addEventListener('pointerdown',function(e){
  var r=cv.getBoundingClientRect();
  var x=e.clientX-r.left,y=e.clientY-r.top;
  if(y>r.height*0.7){
    if(x<r.width*0.5)flipL(1);else flipR(1);
  }else{
    if(!ball&&balls>0)newBall();
    launch.held=true;
  }
});
window.addEventListener('pointerup',function(){flipL(0);flipR(0);launch.held=false});
document.getElementById('new').addEventListener('click',function(){
  balls=3;score=0;combo=1;scEl.textContent=0;
  logEl.textContent='fresh balls on the wire…';newBall();paintBalls();
});
window.addEventListener('resize',fit);
build();fit();newBall();
(function loop(){step();draw();requestAnimationFrame(loop)})();
})();
</script>
</body>
</html>
