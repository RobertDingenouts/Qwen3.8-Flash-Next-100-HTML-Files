<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gravity Shift · Nº 018</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#151226;color:#efe9ff;font-family:"Century Gothic",Futura,Avenir,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px}
header{display:flex;align-items:center;gap:24px;width:min(430px,94vw);justify-content:space-between}
h1{font-size:12px;letter-spacing:.32em;text-transform:uppercase;font-weight:700}
h1 b{color:#ff90e8}
.s{font:10px ui-monospace,Menlo,monospace;letter-spacing:.2em;text-align:right}
.s b{display:block;font-size:17px;color:#8ef0d2}
#wrap{position:relative}
#c{display:block;background:#1c1832;border:2px solid #352e58;border-radius:6px}
#arrow{position:absolute;right:-34px;top:50%;transform:translateY(-50%);font-size:20px;color:#ff90e8;transition:transform .25s}
#arrow.up{transform:translateY(-50%) rotate(180deg)}
.dock{display:flex;gap:8px;width:min(430px,94vw)}
button{flex:1;font:700 10px "Century Gothic",sans-serif;letter-spacing:.2em;padding:13px 6px;background:#241e42;border:2px solid #3a3168;border-radius:6px;color:#efe9ff;cursor:pointer;text-transform:uppercase}
button:hover{border-color:#ff90e8}
button.big{background:#ff90e8;color:#151226;border-color:#ff90e8}
button.big:hover{background:#ffd2f4}
.keys{font:9px ui-monospace,monospace;letter-spacing:.18em;opacity:.5;text-transform:uppercase;text-align:center}
@media(max-width:560px){#arrow{display:none}.keys{letter-spacing:.06em}}
</style>
</head>
<body>
<header><h1>Gravity <b>Shift</b></h1><div class="s">score<b id="sc">0</b></div><div class="s">lines<b id="ln">0</b></div></header>
<div id="wrap"><canvas id="c"></canvas><div id="arrow">▼</div></div>
<div class="dock">
<button id="rot">rotate</button>
<button id="inv" class="big">⇅ invert</button>
<button id="new">new game</button>
</div>
<p class="keys">← → move · ↑ rotate · ↓ soft drop · space inverts gravity</p>
<script>
(function(){
"use strict";
var COLS=9,ROWS=14;
var cv=document.getElementById('c'),ctx=cv.getContext('2d');
var cell=28,W2=0,H2=0,D=1;
var board,cur,score,lines,grav,over,acc,last,holdQ;
var COL=['#f9c74f','#f9844a','#f3722c','#90be6d','#43aa8b','#577590','#b892ff'];
var SHAPES={
 I:[[0,0],[1,0],[2,0],[3,0]],
 O:[[0,0],[1,0],[0,1],[1,1]],
 T:[[0,0],[1,0],[2,0],[1,1]],
 S:[[1,0],[2,0],[0,1],[1,1]],
 Z:[[0,0],[1,0],[1,1],[2,1]],
 J:[[0,0],[0,1],[1,1],[2,1]],
 L:[[2,0],[0,1],[1,1],[2,1]]
};
var KEYS=Object.keys(SHAPES);
function fit(){
  D=Math.min(window.devicePixelRatio||1,2);
  var maxH=innerHeight-190,maxW=Math.min(innerWidth-30,430);
  cell=Math.floor(Math.min(maxH/ROWS,maxW/COLS));
  W2=cell*COLS;H2=cell*ROWS;
  cv.style.width=W2+'px';cv.style.height=H2+'px';
  cv.width=W2*D;cv.height=H2*D;ctx.setTransform(D,0,0,D,0,0);
}
function newGame(){
  board=[];for(var r=0;r<ROWS;r++)board.push(new Uint8Array(COLS));
  score=0;lines=0;grav=1;over=false;acc=0;
  document.getElementById('sc').textContent=0;
  document.getElementById('ln').textContent=0;
  document.getElementById('arrow').classList.remove('up');
  spawn();
}
function spawn(){
  var cid=(Math.random()*7|0)+1;
  var off=SHAPES[KEYS[(Math.random()*7)|0]].map(function(p){return[p[0],p[1]]});
  var cx=0;off.forEach(function(p){cx+=p[0]});cx/=off.length;
  cur={off:off,c:cid,x:Math.round(COLS/2-cx-0.5),y:grav>0?-1:ROWS-2};
  if(coll(cur.x,cur.y,cur.off))over=true;
}
function coll(x,y,off){
  for(var i=0;i<off.length;i++){
    var nx=x+off[i][0],ny=y+off[i][1];
    if(nx<0||nx>=COLS||ny>=ROWS||ny<0)return true;
    if(board[ny][nx])return true;
  }
  return false;
}
function lock(){
  for(var i=0;i<cur.off.length;i++){
    var ny=cur.y+cur.off[i][1],nx=cur.x+cur.off[i][0];
    if(ny>=0&&ny<ROWS&&nx>=0&&nx<COLS)board[ny][nx]=cur.c;
  }
  var cleared=0;
  for(var r=ROWS-1;r>=0;r--){
    var full=true;
    for(var c=0;c<COLS;c++)if(!board[r][c]){full=false;break}
    if(full){cleared++;board.splice(r,1);board.unshift(new Uint8Array(COLS));r++;}
  }
  if(cleared){lines+=cleared;score+=[0,100,300,600,1000][cleared]||1000;
    document.getElementById('sc').textContent=score;
    document.getElementById('ln').textContent=lines;}
  spawn();
}
function rotOff(off){
  var o=off.map(function(p){return[-p[1],p[0]]});
  var minx=1e9,miny=1e9;
  o.forEach(function(p){minx=Math.min(minx,p[0]);miny=Math.min(miny,p[1])});
  return o.map(function(p){return[p[0]-minx,p[1]-miny]});
}
function tryRotate(){
  var o=rotOff(cur.off);
  var kicks=[0,-1,1,-2,2];
  for(var i=0;i<kicks.length;i++)if(!coll(cur.x+kicks[i],cur.y,o)){cur.off=o;cur.x+=kicks[i];return}
}
function invert(){grav*=-1;document.getElementById('arrow').classList.toggle('up',grav<0);acc=0}
function tick(){
  if(over)return;
  if(!coll(cur.x,cur.y+grav,cur.off)){cur.y+=grav}
  else lock();
}
function draw(){
  ctx.fillStyle='#1c1832';ctx.fillRect(0,0,W2,H2);
  ctx.strokeStyle='rgba(255,255,255,0.045)';ctx.lineWidth=1;
  for(var c=1;c<COLS;c++){ctx.beginPath();ctx.moveTo(c*cell,0);ctx.lineTo(c*cell,H2);ctx.stroke()}
  for(var r=1;r<ROWS;r++){ctx.beginPath();ctx.moveTo(0,r*cell);ctx.lineTo(W2,r*cell);ctx.stroke()}
  function blk(x,y,cid){
    var col=COL[cid-1];
    ctx.fillStyle=col;
    var px=x*cell+1.5,py=y*cell+1.5,s=cell-3;
    ctx.fillRect(px,py,s,s);
    ctx.fillStyle='rgba(255,255,255,0.28)';ctx.fillRect(px,py,s,s*0.28);
    ctx.fillStyle='rgba(0,0,0,0.18)';ctx.fillRect(px,py+s*0.72,s,s*0.28);
  }
  for(var r2=0;r2<ROWS;r2++)for(var c2=0;c2<COLS;c2++)if(board[r2][c2])blk(c2,r2,board[r2][c2]);
  if(!over)for(var i=0;i<cur.off.length;i++)blk(cur.x+cur.off[i][0],cur.y+cur.off[i][1],cur.c);
  if(over){
    ctx.fillStyle='rgba(21,18,38,0.78)';ctx.fillRect(0,0,W2,H2);
    ctx.fillStyle='#ff90e8';ctx.font='700 26px Century Gothic,Arial';ctx.textAlign='center';
    ctx.fillText('COLLAPSE',W2/2,H2/2-10);
    ctx.fillStyle='#efe9ff';ctx.font='10px monospace';
    ctx.fillText('NEW GAME TO RE-ENTER',W2/2,H2/2+18);
  }
}
function loop(ts){
  if(!last)last=ts;
  var dt=ts-last;last=ts;
  if(!over){
    var iv=Math.max(130,540-lines*18);
    acc+=dt;
    while(acc>iv){acc-=iv;tick()}
  }
  draw();requestAnimationFrame(loop);
}
window.addEventListener('keydown',function(e){
  if(e.code==='Space'){e.preventDefault();invert();return}
  if(e.code==='ArrowLeft'&&!over&&!coll(cur.x-1,cur.y,cur.off))cur.x--;
  if(e.code==='ArrowRight'&&!over&&!coll(cur.x+1,cur.y,cur.off))cur.x++;
  if(e.code==='ArrowUp'){e.preventDefault();if(!over)tryRotate()}
  if(e.code==='ArrowDown'){e.preventDefault();if(!over&&!coll(cur.x,cur.y+grav,cur.off))cur.y+=grav}
});
document.getElementById('rot').addEventListener('click',function(){if(!over)tryRotate()});
document.getElementById('inv').addEventListener('click',invert);
document.getElementById('new').addEventListener('click',newGame);
var sx=0,sy=0;
cv.addEventListener('touchstart',function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
cv.addEventListener('touchend',function(e){
  var t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
  if(Math.abs(dx)<18&&Math.abs(dy)<18){tryRotate();return}
  if(Math.abs(dx)>Math.abs(dy)){if(!coll(cur.x+(dx>0?1:-1),cur.y,cur.off))cur.x+=dx>0?1:-1}
  else if(Math.abs(dy)>40)invert();
},{passive:true});
window.addEventListener('resize',fit);
fit();newGame();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
