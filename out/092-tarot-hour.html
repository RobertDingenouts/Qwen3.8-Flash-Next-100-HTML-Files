<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tarot Hour · Nº 092</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#111014;color:#e8e0cc;font-family:Georgia,"Iowan Old Style",serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:12px}
header{text-align:center}
h1{font:italic 400 22px Georgia,serif;color:#c9a227}
.tag{font:8px ui-monospace,Menlo,monospace;letter-spacing:.34em;text-transform:uppercase;color:#6a6254;margin-top:5px}
#spread{display:flex;gap:min(20px,3vw);perspective:900px}
.card{width:min(140px,26vw);height:min(230px,43vw);position:relative;cursor:pointer;
transform-style:preserve-3d;transition:transform .8s cubic-bezier(.4,0,.2,1)}
.card.rev{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:8px;backface-visibility:hidden;
border:1.5px solid #c9a227;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.back{background:
 repeating-linear-gradient(45deg,rgba(201,162,39,0.09) 0 6px,transparent 6px 12px),
 radial-gradient(circle at 50% 50%,#1c1a22 0 30%,#141218 90%)}
.back .moon{width:44%;aspect-ratio:1;border-radius:50%;
 background:radial-gradient(circle at 35% 35%,#c9a227 60%,transparent 61%),#0f0e12;
 box-shadow:0 0 30px rgba(201,162,39,0.35)}
.front{transform:rotateY(180deg);background:linear-gradient(#1a1820,#121116);padding:12px;text-align:center}
.front .sym{width:56px;height:56px;position:relative}
.front h2{font:italic 700 15px Georgia,serif;color:#c9a227}
.front p{font-size:9px;font-style:italic;line-height:1.7;color:#a89e86}
.sun{background:conic-gradient(#c9a227 0 8%,transparent 8% 12.5%,#c9a227 12.5% 20.5%,transparent 20.5% 25%,#c9a227 25% 33%,transparent 33% 37.5%,#c9a227 37.5% 45.5%,transparent 45.5% 50%,#c9a227 50% 58%,transparent 58% 62.5%,#c9a227 62.5% 70.5%,transparent 70.5% 75%,#c9a227 75% 83%,transparent 83% 87.5%,#c9a227 87.5% 95.5%,transparent 95.5%);
 border-radius:50%;-webkit-mask:radial-gradient(circle,transparent 0 28%,#000 29%);mask:radial-gradient(circle,transparent 0 28%,#000 29%)}
.moon{border-radius:50%;box-shadow:inset -14px 4px 0 0 #c9a227}
.eye{border-radius:50%;background:radial-gradient(circle,#111 0 18%,#c9a227 19% 42%,transparent 43%);
 border:2px solid #c9a227;border-radius:50% 50% 55% 55%/60% 60% 45% 45%}
.hour{border:2px solid #c9a227;clip-path:polygon(8% 0,92% 0,55% 46%,55% 54%,92% 100%,8% 100%,45% 54%,45% 46%)}
.wheel{border-radius:50%;border:3px solid #c9a227;background:conic-gradient(#c9a227 0 12.5%,transparent 12.5% 25%,#c9a227 25% 37.5%,transparent 37.5% 50%,#c9a227 50% 62.5%,transparent 62.5% 75%,#c9a227 75% 87.5%,transparent 87.5%)}
.star{clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);background:#c9a227}
.tower{background:#c9a227;clip-path:polygon(30% 100%,35% 25%,50% 0,65% 25%,70% 100%)}
.key{border:4px solid #c9a227;border-radius:50% 50% 4% 4%;background:linear-gradient(transparent 55%,#c9a227 55% 65%,transparent 65%)}
.dock{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
button{font:italic 12px Georgia,serif;padding:10px 18px;background:transparent;border:1px solid #6a6254;color:#e8e0cc;cursor:pointer}
button:hover{border-color:#c9a227;color:#c9a227}
#hour{font:9px ui-monospace,Menlo,monospace;letter-spacing:.2em;color:#6a6254}
</style>
</head>
<body>
<header>
<h1>The Tarot of the Hour</h1>
<p class="tag">Nº 092 · the same cards will find you until the clock moves on</p>
</header>
<div id="spread"></div>
<div class="dock">
<button id="flip">turn the cards</button>
<button id="cheat">argue with fate ▸</button>
<span id="hour"></span>
</div>
<script>
(function(){
"use strict";
var DECK=[
['The Sun','sun','What was hidden is merely bright. Do not squint at good news.'],
['The Moon','moon','A tide in your pocket. Walk carefully around water and rumours.'],
['The Eye','eye','Something has noticed you back. It means well, probably.'],
['The Hour','hour','Time is not running out; it is arriving. Let it in.'],
['The Wheel','wheel','The turn you feared is the turn that steers. Hold the rail, not the spoke.'],
['The Star','star','A small light, deliberately unimpressive. Keep it lit anyway.'],
['The Tower','tower','What falls was already leaning. The ground is new and very solid.'],
['The Key','key','The door was never locked. That was always going to be embarrassing.']
];
var spread=document.getElementById('spread');
var hourKey=Math.floor(Date.now()/3600000);
function rng(s){return function(){s|=0;s=(s+0x6D2B79F5)|0;var t=Math.imul(s^(s>>>15),1|s);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}
var order=[];
function deal(){
 var r=rng(hourKey*31+7);
 order=[0,1,2,3,4,5,6,7].sort(function(a,b){return r()-0.5}).slice(0,3);
 spread.innerHTML='';
 var POS=['what passed','this hour','what turns up'];
 order.forEach(function(ci,i){
  var cd=DECK[ci];
  var el=document.createElement('div');
  el.className='card';
  el.innerHTML='<div class="face back"><div class="moon"></div></div>'+
   '<div class="face front"><div class="sym '+cd[1]+'"></div><h2>'+cd[0]+'</h2><p>'+POS[i]+' — '+cd[2]+'</p></div>';
  el.addEventListener('click',function(){el.classList.toggle('rev')});
  spread.appendChild(el);
 });
 document.getElementById('hour').textContent=
  'sealed for '+new Date().toLocaleTimeString([], {hour:'2-digit'});
}
document.getElementById('flip').addEventListener('click',function(){
 var any=[].some.call(spread.children,function(c){return !c.classList.contains('rev')});
 [].forEach.call(spread.children,function(c){c.classList.toggle('rev',any)});
});
document.getElementById('cheat').addEventListener('click',function(){
 hourKey+=1+((Math.random()*20)|0);
 deal();
});
deal();
setInterval(function(){
 var hk=Math.floor(Date.now()/3600000);
 if(hk!==hourKey){hourKey=hk;deal()}
},30000);
})();
</script>
</body>
</html>
