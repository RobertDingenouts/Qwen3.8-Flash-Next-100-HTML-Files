<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Asteroid Sweep · Nº 020</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#020b05;color:#58ff9b;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.scan{position:fixed;inset:0;pointer-events:none;
 background:repeating-linear-gradient(0deg,rgba(0,0,0,0.22) 0 2px,rgba(0,0,0,0) 2px 4px);
 mix-blend-mode:multiply}
.vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(0,0,0,0.55) 100%)}
.hud{position:fixed;top:12px;left:0;right:0;display:flex;justify-content:center;gap:28px;pointer-events:none}
.stat{font-size:9px;letter-spacing:.3em;text-transform:uppercase;text-shadow:0 0 8px #58ff9b}
.stat b{display:block;font-size:18px;letter-spacing:0}
h1{position:fixed;top:12px;left:16px;font-size:10px;letter-spacing:.3em;text-transform:uppercase;font-weight:400;pointer-events:none;text-shadow:0 0 8px #58ff9b}
.dock{position:fixed;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:8px}
button{font:9px ui-monospace,monospace;letter-spacing:.2em;text-transform:uppercase;padding:10px 14px;background:rgba(88,255,155,0.07);border:1px solid rgba(88,255,155,0.4);color:#58ff9b;cursor:pointer;text-shadow:0 0 6px #58ff9b}
button:hover,button.on{background:#58ff9b;color:#020b05;text-shadow:none}
#msg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:rgba(2,11,5,0.72)}
#msg h2{font-size:26px;letter-spacing:.3em;text-shadow:0 0 14px #58ff9b;animation:blink 1.2s steps(2) infinite}
#msg p{font-size:10px;letter-spacing:.24em;text-transform:uppercase;opacity:.8}
@keyframes blink{50%{opacity:.35}}
@media(max-width:560px){.hud{gap:18px}h1{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="scan"></div><div class="vig"></div>
<h1>Asteroid Sweep — Nº 020</h1>
<div class="hud">
<div class="stat">mines<b id="mn">0</b></div>
<div class="stat">uptime<b id="tm">0s</b></div>
<div class="stat">sector<b id="sec">7-G</b></div>
</div>
<div class="dock">
<button id="mode">mode: scan</button>
<button id="new">new sweep</button>
</div>
<div id="msg"><h2 id="mt">SWEEP FAILED</h2><p id="mp">asteroid impact detected · press new sweep</p></div>
<script>
(function(){
"use strict";
var cv=document.getElementById('c'),ctx=cv.getContext('2d'),D=1,W=0,H=0;
var COLS=10,ROWS=10,MINES=14,cell=40,ox=0,oy=0;
var cells,started,dead,won,flags,time,t0,mode='scan';
var mnEl=document.getElementById('mn'),tmEl=document.getElementById('tm');
var SECT=['7-G','K-9','4-B','Ω-2','12-F'];
function fit(){
  D=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=W*D;cv.height=H*D;ctx.setTransform(D,0,0,D,0,0);
  var availW=Math.min(W-20,520),availH=H-150;
  cell=Math.floor(Math.min(availW/COLS,availH/ROWS));
  ox=(W-cell*COLS)/2;oy=(H-cell*ROWS)/2+8;
  draw();
}
function reset(){
  cells=[];for(var i=0;i<COLS*ROWS;i++)cells.push({m:0,adj:0,open:0,flag:0});
  started=false;dead=false;won=false;flags=0;time=0;t0=0;
  document.getElementById('msg').style.display='none';
  mnEl.textContent=MINES;tmEl.textContent='0s';
  document.getElementById('sec').textContent=SECT[(Math.random()*SECT.length)|0];
  draw();
}
function idx(r,c){return r*COLS+c}
function neighbors(r,c){
  var out=[];
  for(var dr=-1;dr<=1;dr++)for(var dc=-1;dc<=1;dc++){
    if(!dr&&!dc)continue;
    var nr=r+dr,nc=c+dc;
    if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS)out.push([nr,nc]);
  }
  return out;
}
function plant(sr,sc){
  var placed=0;
  while(placed<MINES){
    var r=(Math.random()*ROWS)|0,c=(Math.random()*COLS)|0;
    if(Math.abs(r-sr)+Math.abs(c-sc)<2)continue;
    var cc=cells[idx(r,c)];
    if(cc.m)continue;
    cc.m=1;placed++;
  }
  for(var r2=0;r2<ROWS;r2++)for(var c2=0;c2<COLS;c2++){
    var cc2=cells[idx(r2,c2)],n=0;
    neighbors(r2,c2).forEach(function(p){if(cells[idx(p[0],p[1])].m)n++});
    cc2.adj=n;
  }
}
function flood(r,c){
  var st=[[r,c]];
  while(st.length){
    var p=st.pop(),cc=cells[idx(p[0],p[1])];
    if(cc.open||cc.flag)continue;
    cc.open=1;
    if(!cc.m&&cc.adj===0)neighbors(p[0],p[1]).forEach(function(q){
      var qq=cells[idx(q[0],q[1])];if(!qq.open&&!qq.m)st.push(q)});
  }
}
function reveal(r,c){
  var cc=cells[idx(r,c)];
  if(cc.open||cc.flag||dead||won)return;
  if(!started){started=true;t0=performance.now();plant(r,c)}
  if(cc.m){dead=true;
    for(var i=0;i<cells.length;i++)if(cells[i].m)cells[i].open=1;
    document.getElementById('mt').textContent='SWEEP FAILED';
    document.getElementById('mp').textContent='asteroid impact detected · press new sweep';
    document.getElementById('msg').style.display='flex';
    draw();return;
  }
  flood(r,c);
  var opened=0;
  cells.forEach(function(x){if(x.open)opened++});
  if(opened===cells.length-MINES){
    won=true;
    document.getElementById('mt').textContent='SECTOR CLEAR';
    document.getElementById('mp').textContent='no debris on approach vector · well flown';
    document.getElementById('msg').style.display='flex';
  }
  draw();
}
function flag(r,c){
  var cc=cells[idx(r,c)];
  if(cc.open||dead||won)return;
  cc.flag=cc.flag?0:1;flags+=cc.flag?1:-1;
  mnEl.textContent=Math.max(0,MINES-flags);
  draw();
}
function draw(){
  if(!cells)return;
  ctx.fillStyle='#020b05';ctx.fillRect(0,0,W,H);
  ctx.font='700 '+Math.round(cell*0.5)+'px ui-monospace,Menlo,monospace';
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++){
    var cc=cells[idx(r,c)],x=ox+c*cell,y=oy+r*cell;
    if(!cc.open){
      var g=0.10+((r*31+c*17)%9)*0.008;
      ctx.fillStyle='rgba(88,255,155,'+g+')';
      ctx.fillRect(x+1,y+1,cell-2,cell-2);
      ctx.strokeStyle='rgba(88,255,155,0.28)';
      ctx.strokeRect(x+1.5,y+1.5,cell-3,cell-3);
      if(cc.flag){
        ctx.fillStyle='#58ff9b';
        ctx.beginPath();
        ctx.moveTo(x+cell*0.32,y+cell*0.22);
        ctx.lineTo(x+cell*0.68,y+cell*0.36);
        ctx.lineTo(x+cell*0.32,y+cell*0.5);
        ctx.closePath();ctx.fill();
        ctx.fillRect(x+cell*0.31,y+cell*0.22,2.2,cell*0.5);
      }
    }else{
      ctx.fillStyle='rgba(88,255,155,0.035)';
      ctx.fillRect(x+1,y+1,cell-2,cell-2);
      if(cc.m){
        ctx.fillStyle='#ffb300';
        ctx.shadowColor='#ffb300';ctx.shadowBlur=10;
        ctx.beginPath();
        var cx=x+cell/2,cy=y+cell/2,rr=cell*0.26;
        for(var k=0;k<7;k++){
          var a=k/7*6.283-1.2,rad=rr*(0.75+((k*37)%5)*0.09);
          k?ctx.lineTo(cx+Math.cos(a)*rad,cy+Math.sin(a)*rad):ctx.moveTo(cx+Math.cos(a)*rad,cy+Math.sin(a)*rad);
        }
        ctx.closePath();ctx.fill();ctx.shadowBlur=0;
      }else if(cc.adj>0){
        var lum=[0,0.55,0.65,0.75,0.85,0.9,0.95,1,1][cc.adj];
        ctx.fillStyle='rgba(88,255,155,'+lum+')';
        ctx.shadowColor='#58ff9b';ctx.shadowBlur=8*cc.adj/4;
        ctx.fillText(cc.adj,x+cell/2,y+cell/2+1);
        ctx.shadowBlur=0;
      }
    }
  }
  ctx.strokeStyle='rgba(88,255,155,0.3)';
  ctx.strokeRect(ox-4.5,oy-4.5,cell*COLS+8,cell*ROWS+8);
}
var lp=null,lt=0;
cv.addEventListener('pointerdown',function(e){
  lt=Date.now();lp=[Math.floor((e.clientY-oy)/cell),Math.floor((e.clientX-ox)/cell)];
  var t=setTimeout(function(){if(lp){flag(lp[0],lp[1]);lp=null}},420);
  cv._t=t;
});
cv.addEventListener('pointerup',function(e){
  clearTimeout(cv._t);
  if(!lp)return;lp=null;
  var r=Math.floor((e.clientY-oy)/cell),c=Math.floor((e.clientX-ox)/cell);
  if(r<0||r>=ROWS||c<0||c>=COLS)return;
  if(e.button===2){flag(r,c);return}
  if(mode==='flag')flag(r,c);else reveal(r,c);
});
cv.addEventListener('contextmenu',function(e){e.preventDefault()});
var modeBtn=document.getElementById('mode');
modeBtn.addEventListener('click',function(){
  mode=mode==='scan'?'flag':'scan';
  modeBtn.textContent='mode: '+mode;
  modeBtn.classList.toggle('on',mode==='flag');
});
document.getElementById('new').addEventListener('click',reset);
function loop(ts){
  if(started&&!dead&&!won)tmEl.textContent=Math.floor((ts-t0)/1000)+'s';
  requestAnimationFrame(loop);
}
window.addEventListener('resize',fit);
fit();reset();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
