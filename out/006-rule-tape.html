<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rule Machine · Nº 006</title>
<style>
:root{--paper:#f6f4ee;--ink:#1c1b18}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;background:var(--paper)}
.panel{position:fixed;left:18px;top:18px;width:250px;background:rgba(246,244,238,.92);border:2px solid var(--ink);padding:16px 16px 14px;z-index:2}
h1{font-size:13px;letter-spacing:.28em;text-transform:uppercase;border-bottom:2px solid var(--ink);padding-bottom:10px}
h1 b{background:var(--ink);color:var(--paper);padding:1px 6px}
.rule{display:flex;align-items:baseline;gap:10px;margin:14px 0 4px}
#rn{font-size:52px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.rule small{font-size:10px;letter-spacing:.18em;text-transform:uppercase;opacity:.7}
.arrows{display:flex;flex-direction:column;gap:4px}
.arrows button{padding:2px 12px;font-size:14px;line-height:1.2}
button{font:inherit;font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:7px 9px;background:var(--paper);border:1.5px solid var(--ink);cursor:pointer}
button:hover{background:var(--ink);color:var(--paper)}
.presets{display:flex;flex-wrap:wrap;gap:5px;margin:12px 0}
.row{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.row label{font-size:9px;letter-spacing:.14em;display:flex;align-items:center;gap:5px;text-transform:uppercase}
input[type=range]{width:86px;accent-color:#1c1b18}
.tag{font-size:9px;letter-spacing:.1em;opacity:.65;margin-top:10px;line-height:1.6}
@media(max-width:700px){.panel{left:8px;right:8px;top:auto;bottom:8px;width:auto;padding:10px 12px}
#rn{font-size:34px}.tag{display:none}h1{font-size:11px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="panel">
<h1>Rule Machine <b>Nº 006</b></h1>
<div class="rule"><span id="rn">30</span><small>wolfram code</small>
<div class="arrows"><button id="up">▲</button><button id="dn">▼</button></div></div>
<div class="presets" id="presets"></div>
<div class="row">
<label>feed <input id="spd" type="range" min="1" max="10" value="4"></label>
<label><input id="mode" type="checkbox" checked> opus colour</label>
<label><input id="wrap" type="checkbox" checked> wrap</label>
</div>
<div class="row"><button id="reseed">reseed top</button><button id="single">single cell</button></div>
<p class="tag">each row is one generation of a 1-D world: a cell lives if its 3-cell neighbourhood's binary pattern matches a bit of the rule. click anywhere on the tape to scar a new seed line.</p>
</div>
<script>
(function(){
"use strict";
var cv=document.getElementById('c'),ctx=cv.getContext('2d');
var W=0,H=0,D=1,CELL=7,cols=0,prev=null,rule=30,tickAcc=0,modeOn=true;
var rnEl=document.getElementById('rn'),spd=document.getElementById('spd');
var modeEl=document.getElementById('mode'),wrapEl=document.getElementById('wrap');
var PAL=['#1c1b18','#b3282d','#2a4b8d','#c98a12','#3e7a3f','#6c3d8c','#1e7e7e','#8a4b2a'];
function fit(){
  D=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=W*D;cv.height=H*D;ctx.setTransform(D,0,0,D,0,0);
  CELL=W<500?6:7;cols=Math.max(24,Math.floor(W/CELL));
  seedRandom();
}
function drawSeedRow(){
  for(var i=0;i<cols;i++)if(prev[i]){ctx.fillStyle='#1c1b18';ctx.fillRect(i*CELL,H-CELL,CELL-1,CELL-1)}
}
function seedRandom(){prev=new Uint8Array(cols);
  for(var i=0;i<cols;i++)prev[i]=Math.random()<0.5?1:0;
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#f6f4ee';ctx.fillRect(0,0,cv.width,cv.height);ctx.setTransform(D,0,0,D,0,0);drawSeedRow()}
function seedSingle(){prev=new Uint8Array(cols);prev[cols>>1]=1;
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#f6f4ee';ctx.fillRect(0,0,cv.width,cv.height);ctx.setTransform(D,0,0,D,0,0);drawSeedRow()}
function scroll(rowH){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.drawImage(cv,0,rowH*D,cv.width,cv.height-rowH*D,0,0,cv.width,cv.height-rowH*D);
  ctx.fillStyle='#f6f4ee';ctx.fillRect(0,cv.height-rowH*D,cv.width,rowH*D);
  ctx.setTransform(D,0,0,D,0,0);
}
function nextRow(){
  var nxt=new Uint8Array(cols),w=rule&1;
  for(var i=0;i<cols;i++){
    var l=prev[i===0?(wrapEl.checked?cols-1:0):i-1];
    var c=prev[i],r=prev[i===cols-1?(wrapEl.checked?0:cols-1):i+1];
    var p=(l<<2)|(c<<1)|r,v=(rule>>p)&1;nxt[i]=v;
    if(v){
      if(modeOn)ctx.fillStyle=PAL[p+1];
      else ctx.fillStyle='#1c1b18';
      ctx.fillRect(i*CELL,H-CELL,CELL-1,CELL-1);
    }else if(p===0&&Math.random()<0.12){
      ctx.fillStyle='rgba(28,27,24,0.06)';ctx.fillRect(i*CELL,H-CELL,CELL-1,CELL-1);
    }
  }
  prev=nxt;
}
function setRule(n){rule=(n+256)%256;rnEl.textContent=rule}
function loop(ts){
  tickAcc++;
  if(tickAcc%Math.max(1,Math.floor(8/(+spd.value)))===0){
    scroll(CELL);nextRow();
  }
  requestAnimationFrame(loop);
}
var ps=document.getElementById('presets');
[30,45,57,90,105,110,122,126,150,184,250].forEach(function(r){
  var b=document.createElement('button');b.textContent='R'+r;
  b.addEventListener('click',function(){setRule(r);seedRandom()});ps.appendChild(b);
});
document.getElementById('up').addEventListener('click',function(){setRule(rule+1)});
document.getElementById('dn').addEventListener('click',function(){setRule(rule-1)});
document.getElementById('reseed').addEventListener('click',seedRandom);
document.getElementById('single').addEventListener('click',seedSingle);
cv.addEventListener('pointerdown',function(e){
  var y=Math.floor(e.clientY),row=new Uint8Array(cols);
  for(var i=0;i<cols;i++)row[i]=Math.random()<0.5?1:0;
  var yy=y-CELL;
  for(var r=0;r<6;r++){
    ctx.fillStyle='#f6f4ee';ctx.fillRect(0,yy+CELL+ (4-r)*CELL,W,CELL);
  }
  for(var i=0;i<cols;i++)if(row[i]){ctx.fillStyle=modeOn.checked?PAL[(i+pseudo(i))%8]:'#1c1b18';ctx.fillRect(i*CELL,y,CELL-1,CELL-1)}
  function pseudo(i){return (i*7)%8}
});
window.addEventListener('keydown',function(e){
  if(e.key==='ArrowUp')setRule(rule+1);
  if(e.key==='ArrowDown')setRule(rule-1);
});
window.addEventListener('resize',fit);
fit();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
