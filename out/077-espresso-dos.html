<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Espresso Dos · Nº 077</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%;background:#efe9e1;color:#3a2e26;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
body{overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-1;
background:
 radial-gradient(ellipse 300px 40px at 20% 30%,rgba(180,160,140,0.35),transparent 70%),
 radial-gradient(ellipse 400px 30px at 70% 65%,rgba(160,140,120,0.3),transparent 70%),
 radial-gradient(ellipse 200px 60px at 50% 90%,rgba(190,170,150,0.3),transparent 70%),
 linear-gradient(#f4efe8,#e8e1d6)}
header{padding:26px 7vw 6px;display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px}
h1{font:400 26px Georgia,serif}
h1 b{font-style:italic;color:#8a5a34}
.tag{font:9px ui-monospace,Menlo,monospace;letter-spacing:.28em;text-transform:uppercase;color:#9a8a76}
#wrap{display:flex;gap:18px;padding:14px 7vw 40px;flex-wrap:wrap;align-items:flex-start}
.card{background:rgba(255,253,250,0.85);border-radius:10px;padding:20px;flex:1 1 300px;
box-shadow:0 18px 36px -22px rgba(58,46,38,0.45)}
.card h2{font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:#9a8a76;margin-bottom:14px}
.kv{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;border-bottom:1px dashed #ddd2c2}
.kv b{font:700 17px ui-monospace,Menlo,monospace;color:#3a2e26}
.kv span{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:#9a8a76}
input[type=range]{width:100%;accent-color:#8a5a34;margin-top:10px}
#timer{font:700 clamp(40px,9vw,64px)/1 ui-monospace,Menlo,monospace;letter-spacing:.02em;text-align:center;margin:6px 0 2px}
#stages{display:flex;gap:3px;height:12px;margin:10px 0}
#stages div{flex:1;border-radius:3px;opacity:.25;transition:opacity .3s}
#stages div.on{opacity:1}
.stLbl{display:flex;justify-content:space-between;font:8px ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;color:#9a8a76}
button{font:700 9px "Helvetica Neue",sans-serif;letter-spacing:.24em;text-transform:uppercase;
padding:12px 18px;background:#3a2e26;color:#f4efe8;border:none;cursor:pointer;border-radius:4px;width:100%;margin-top:10px}
button:hover{background:#8a5a34}
#cup{width:90px;height:78px;margin:14px auto 0;border:3px solid #3a2e26;border-top:none;border-radius:0 0 16px 16px;position:relative;overflow:hidden}
#cup:after{content:'';position:absolute;right:-22px;top:12px;width:20px;height:26px;border:3px solid #3a2e26;border-left:none;border-radius:0 12px 12px 0}
#fill{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(#7a4a24,#4a2a12);transition:height .2s}
#fill:before{content:'';position:absolute;top:0;left:0;right:0;height:5px;background:#c89a5e}
</style>
</head>
<body>
<div class="bg"></div>
<header><h1>Espresso <b>Dos</b></h1><p class="tag">Nº 077 · the ratio gospel, weighed on marble</p></header>
<div id="wrap">
<div class="card">
<h2>recipe calculator</h2>
<div class="kv"><span>dose — coffee in</span><b id="vD">18.0 g</b></div>
<div class="kv"><span>ratio</span><b id="vR">1:2.0</b></div>
<div class="kv"><span>yield — espresso out</span><b id="vY">36.0 g</b></div>
<div class="kv"><span>brew time target</span><b id="vT">28 s</b></div>
<input id="dose" type="range" min="14" max="22" step="0.5" value="18">
<input id="ratio" type="range" min="15" max="30" step="1" value="20">
<input id="time" type="range" min="20" max="40" step="1" value="28">
</div>
<div class="card">
<h2>brew timer · pour-over cadence</h2>
<div id="timer">0:00</div>
<div id="stages"></div>
<div class="stLbl"><span>bloom</span><span>pours 1–3</span><span>drawdown</span></div>
<div id="cup"><div id="fill"></div></div>
<button id="go">start brew</button>
</div>
</div>
<script>
(function(){
"use strict";
var dose=document.getElementById('dose'),ratio=document.getElementById('ratio'),time=document.getElementById('time');
function calc(){
  var d=+dose.value,r=+ratio.value/10,t=+time.value;
  document.getElementById('vD').textContent=d.toFixed(1)+' g';
  document.getElementById('vR').textContent='1:'+r.toFixed(1);
  document.getElementById('vY').textContent=(d*r).toFixed(1)+' g';
  document.getElementById('vT').textContent=t+' s';
}
[dose,ratio,time].forEach(function(el){el.addEventListener('input',calc)});
var STAGES=[
{n:'bloom',until:35,c:'#c89a5e'},
{n:'pour 1',until:65,c:'#8a5a34'},
{n:'pour 2',until:110,c:'#8a5a34'},
{n:'pour 3',until:150,c:'#8a5a34'},
{n:'drawdown',until:180,c:'#4a2a12'}];
var stEl=document.getElementById('stages');
STAGES.forEach(function(s){var d=document.createElement('div');d.style.background=s.c;stEl.appendChild(d)});
var t0=0,running=false,iv=null;
function fmt(s){return Math.floor(s/60)+':'+('0'+Math.floor(s%60)).slice(-2)}
function tick(){
  var s=(Date.now()-t0)/1000;
  var total=180;
  document.getElementById('timer').textContent=fmt(s);
  var si=STAGES.findIndex(function(x){return s<x.until});
  if(si<0){finish();return}
  stEl.children.length&&[].forEach.call(stEl.children,function(d,i){
    d.classList.toggle('on',i<=si);
  });
  document.getElementById('fill').style.height=Math.min(100,s/total*100)+'%';
  stEl.children[si].setAttribute('title',STAGES[si].n);
  if(stEl.lastActive!==si){
    stEl.lastActive=si;
    document.getElementById('timer').style.color=si===0?'#8a5a34':si===4?'#4a2a12':'#3a2e26';
  }
  if(s>=total)finish();
}
function finish(){
  running=false;clearInterval(iv);
  document.getElementById('go').textContent='another shot';
  document.getElementById('timer').textContent='0:00';
  [].forEach.call(stEl.children,function(d){d.classList.remove('on')});
  stEl.lastActive=-1;
  document.getElementById('timer').style.color='#3a2e26';
}
document.getElementById('go').addEventListener('click',function(){
  if(running){finish();return}
  running=true;t0=Date.now();
  stEl.lastActive=-1;
  this.textContent='abort';
  iv=setInterval(tick,200);
});
calc();
})();
</script>
</body>
</html>
