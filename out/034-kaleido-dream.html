<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kaleido Dream · Nº 034</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#0d0512;font-family:"Palatino Linotype",Palatino,Georgia,serif}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
.tl{position:fixed;top:18px;left:22px;pointer-events:none;color:#f2e6ff;text-shadow:0 2px 14px #000}
h1{font:italic 400 25px/1.1 Palatino,Georgia,serif}
h1 span{display:block;font:600 9px ui-monospace,Menlo,monospace;letter-spacing:.5em;text-transform:uppercase;opacity:.7;margin-bottom:8px}
.dock{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
button{font:italic 12px Palatino,serif;letter-spacing:.08em;padding:9px 15px;background:rgba(13,5,18,.55);color:#f2e6ff;border:1px solid rgba(242,230,255,.35);cursor:pointer}
button:hover{background:#f2e6ff;color:#0d0512}
label{color:#f2e6ff;font-size:9px;letter-spacing:.2em;text-transform:uppercase;display:flex;gap:8px;align-items:center;text-shadow:0 1px 6px #000}
input[type=range]{width:92px;accent-color:#d94fd0}
.hint{position:fixed;right:20px;top:20px;color:#f2e6ff;font:10px ui-monospace,monospace;letter-spacing:.2em;text-transform:uppercase;opacity:.5;text-align:right;pointer-events:none;line-height:1.9}
@media(max-width:560px){.hint{display:none}h1{font-size:18px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="tl"><h1><span>Nº 034 · prismatic parlour</span>Kaleido Dream</h1></div>
<p class="hint">drag horizontally to turn the drum<br>drag vertically to slide the glass</p>
<div class="dock">
<button id="stone">cut a new stone</button>
<label>facets <input id="fac" type="range" min="4" max="16" value="10"></label>
<label>depth <input id="zm" type="range" min="40" max="240" value="100"></label>
<button id="spin">spin: on</button>
</div>
<script>
(function(){
"use strict";
var cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=0,H=0,D=1;
var tile=document.createElement('canvas'),tctx=tile.getContext('2d');
var TS=760,rot=0,offX=0,offY=0,zoom=1,spin=true,facets=10,seed=99;
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;var t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function cutStone(){
  var r=rng(seed);
  tile.width=TS;tile.height=TS;
  var hues=[r()*360,r()*360,r()*360];
  tctx.fillStyle='hsl('+hues[0]+',30%,8%)';
  tctx.fillRect(0,0,TS,TS);
  for(var i=0;i<46;i++){
    var h=hues[(r()*3)|0];
    var x=r()*TS,y=r()*TS,rad=30+r()*220;
    var g=tctx.createRadialGradient(x,y,1,x,y,rad);
    g.addColorStop(0,'hsla('+h+',85%,'+(45+r()*30)+'%,0.85)');
    g.addColorStop(1,'hsla('+h+',85%,20%,0)');
    tctx.fillStyle=g;
    tctx.beginPath();tctx.arc(x,y,rad,0,7);tctx.fill();
  }
  tctx.globalAlpha=0.5;
  for(i=0;i<26;i++){
    tctx.strokeStyle='hsla('+hues[(r()*3)|0]+',90%,75%,0.5)';
    tctx.lineWidth=1+r()*4;
    tctx.beginPath();
    var x1=r()*TS,y1=r()*TS;
    tctx.moveTo(x1,y1);
    tctx.bezierCurveTo(r()*TS,r()*TS,r()*TS,r()*TS,r()*TS,r()*TS);
    tctx.stroke();
  }
  tctx.globalAlpha=1;
  for(i=0;i<900;i++){
    tctx.fillStyle='rgba(255,255,255,'+r()*0.08+')';
    tctx.fillRect(r()*TS,r()*TS,2,2);
  }
}
function fit(){D=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
 cv.width=W*D;cv.height=H*D;ctx.setTransform(D,0,0,D,0,0)}
function draw(){
  if(spin)rot+=0.0021;
  ctx.fillStyle='#0d0512';ctx.fillRect(0,0,W,H);
  ctx.save();
  ctx.translate(W/2,H/2);
  var R=Math.hypot(W,H)/2+20;
  var a=2*Math.PI/facets;
  for(var i=0;i<facets;i++){
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.arc(0,0,R,i*a,(i+1)*a);
    ctx.closePath();
    ctx.clip();
    ctx.rotate(i*a+rot);
    if(i%2===1)ctx.scale(1,-1);
    ctx.scale(zoom,zoom);
    ctx.drawImage(tile,
      -TS/2+offX%(TS/2),-TS/2+offY%(TS/2),TS,TS);
    ctx.restore();
  }
  ctx.globalAlpha=0.12;
  ctx.strokeStyle='#f2e6ff';
  for(i=0;i<facets;i++){
    ctx.beginPath();ctx.moveTo(0,0);
    ctx.lineTo(Math.cos(i*a+rot)*R,Math.sin(i*a+rot)*R);
    ctx.stroke();
  }
  ctx.globalAlpha=1;
  var g=ctx.createRadialGradient(0,0,0,0,0,R);
  g.addColorStop(0,'rgba(255,255,255,0.10)');
  g.addColorStop(0.35,'rgba(255,255,255,0)');
  g.addColorStop(1,'rgba(0,0,0,0.6)');
  ctx.fillStyle=g;
  ctx.beginPath();ctx.arc(0,0,R,0,7);ctx.fill();
  ctx.restore();
  requestAnimationFrame(draw);
}
var dragging=false,px=0,py=0;
cv.addEventListener('pointerdown',function(e){dragging=true;px=e.clientX;py=e.clientY;cv.style.cursor='grabbing'});
window.addEventListener('pointermove',function(e){
  if(!dragging)return;
  rot+=(e.clientX-px)*0.004;
  offY+=(e.clientY-py)*0.6;
  px=e.clientX;py=e.clientY;
},{passive:true});
window.addEventListener('pointerup',function(){dragging=false;cv.style.cursor='grab'});
window.addEventListener('wheel',function(e){
  zoom=Math.max(0.4,Math.min(2.4,zoom-Math.sign(e.deltaY)*0.06));
  document.getElementById('zm').value=Math.round(zoom*100);
},{passive:true});
document.getElementById('stone').addEventListener('click',function(){seed=(Math.random()*1e9)|0;cutStone()});
document.getElementById('fac').addEventListener('input',function(e){facets=+e.target.value});
document.getElementById('zm').addEventListener('input',function(e){zoom=+e.target.value/100});
var sb=document.getElementById('spin');
sb.addEventListener('click',function(){spin=!spin;sb.textContent='spin: '+(spin?'on':'off')});
window.addEventListener('resize',fit);
fit();cutStone();requestAnimationFrame(draw);
})();
</script>
</body>
</html>
