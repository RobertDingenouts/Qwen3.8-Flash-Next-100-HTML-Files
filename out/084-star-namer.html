<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Star Namer · Nº 084</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#0d1530;color:#e8e0c8;font-family:Georgia,"Iowan Old Style",serif}
body{display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:baseline;padding:14px 18px 8px;flex-wrap:wrap;gap:6px}
h1{font:italic 400 22px Georgia,serif}
h1 b{font-style:normal;color:#d8b45a}
.tag{font:8px ui-monospace,Menlo,monospace;letter-spacing:.3em;text-transform:uppercase;color:#5d6a94}
#c{flex:1;min-height:0;cursor:crosshair;touch-action:manipulation;display:block;width:100%}
#bar{display:flex;gap:10px;align-items:center;padding:10px 18px 14px;flex-wrap:wrap}
input[type=text]{background:#131c3d;border:1px solid #2e3a68;color:#e8e0c8;padding:10px 12px;
font:italic 14px Georgia,serif;width:min(260px,60vw)}
input[type=text]:focus{outline:none;border-color:#d8b45a}
button{font:700 8px ui-monospace,monospace;letter-spacing:.22em;text-transform:uppercase;
background:transparent;border:1px solid #5d6a94;color:#e8e0c8;padding:10px 13px;cursor:pointer}
button:hover{background:#d8b45a;color:#0d1530;border-color:#d8b45a}
#saved{font:8px ui-monospace,monospace;letter-spacing:.14em;color:#8a92b8;max-width:40vw;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
</style>
</head>
<body>
<header>
<div><h1>Star <b>Namer</b></h1><p class="tag">Nº 084 · connect the dots before the astronomers do</p></div>
<p class="tag" id="hint">click stars to string them · undo · name it · claim it</p>
</header>
<canvas id="c"></canvas>
<div id="bar">
<input id="name" type="text" placeholder="name this constellation…" maxlength="26">
<button id="done">✓ claim</button>
<button id="undo">undo</button>
<button id="clear">wipe sky</button>
<button id="rand">new sky</button>
<span id="saved"></span>
</div>
<script>
(function(){
"use strict";
var cv=document.getElementById('c'),ctx=cv.getContext('2d'),D=1,W=0,H=0;
var stars=[],edges=[],savedList=[];
try{savedList=JSON.parse(localStorage.getItem('starnamer')||'[]')}catch(e){}
var seed=42;
function rng(s){return function(){s|=0;s=(s+0x6D2B79F5)|0;var t=Math.imul(s^(s>>>15),1|s);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}
var tw=0;
function mkStars(){
  var r=rng(seed);
  stars=[];
  var n=26+((r()*10)|0);
  for(var i=0;i<n;i++){
    stars.push({x:0.05+r()*0.9,y:0.06+r()*0.88,m:0.4+r()*1.6,ph:r()*7});
  }
  edges=[];
}
function fit(){D=Math.min(window.devicePixelRatio||1,2);
 var r=cv.getBoundingClientRect();
 W=r.width;H=r.height;
 cv.width=W*D;cv.height=H*D;ctx.setTransform(D,0,0,D,0,0)}
function px(s){return{x:s.x*W,y:s.y*H}}
function draw(){
  ctx.clearRect(0,0,W,H);
  var g=ctx.createRadialGradient(W*0.7,H*0.2,0,W*0.7,H*0.2,W*0.9);
  g.addColorStop(0,'#182450');g.addColorStop(1,'#0d1530');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  stars.forEach(function(s){
    var p=px(s);
    var a=0.55+0.45*Math.sin(tw*2+s.ph);
    ctx.fillStyle='rgba(232,224,200,'+a+')';
    ctx.beginPath();ctx.arc(p.x,p.y,s.m,0,7);ctx.fill();
    if(s.m>1.5){
      ctx.fillStyle='rgba(216,180,90,'+a*0.25+')';
      ctx.beginPath();ctx.arc(p.x,p.y,s.m*3,0,7);ctx.fill();
    }
  });
  ctx.strokeStyle='rgba(216,180,90,0.75)';
  ctx.lineWidth=1.4;
  ctx.setLineDash([1,5]);
  edges.forEach(function(e){
    var a=px(stars[e[0]]),b=px(stars[e[1]]);
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
  });
  ctx.setLineDash([]);
  var used={};
  edges.forEach(function(e){used[e[0]]=1;used[e[1]]=1});
  Object.keys(used).forEach(function(i){
    var p=px(stars[i]);
    ctx.strokeStyle='#d8b45a';
    ctx.beginPath();ctx.arc(p.x,p.y,7,0,7);ctx.stroke();
  });
  if(savedList.length){
    ctx.fillStyle='rgba(232,224,200,0.12)';
    ctx.font='italic '+(H*0.16)+'px Georgia,serif';
    ctx.fillText(savedList[savedList.length-1].n,W*0.06,H*0.94);
  }
}
cv.addEventListener('pointerdown',function(e){
  var r=cv.getBoundingClientRect();
  var x=e.clientX-r.left,y=e.clientY-r.top;
  var bi=-1,bd=26;
  stars.forEach(function(s,i){
    var p=px(s);
    var d=Math.hypot(p.x-x,p.y-y);
    if(d<bd){bd=d;bi=i}
  });
  if(bi>=0){
    var last=edges.length?edges[edges.length-1][1]:-1;
    if(last!==bi)edges.push([last===-1?bi:last,bi]);
    else edges.push([bi,bi]);
  }
});
document.getElementById('undo').addEventListener('click',function(){edges.pop()});
document.getElementById('clear').addEventListener('click',function(){edges=[]});
document.getElementById('rand').addEventListener('click',function(){seed=(Math.random()*1e9)|0;mkStars()});
document.getElementById('done').addEventListener('click',function(){
  var n=document.getElementById('name').value.trim();
  if(!n||edges.length<2)return;
  savedList.push({n:n,e:edges.length});
  try{localStorage.setItem('starnamer',JSON.stringify(savedList))}catch(e){}
  document.getElementById('saved').textContent='claimed: '+savedList.map(function(s){return s.n}).join(' · ');
  document.getElementById('name').value='';
  edges=[];
});
function loop(ts){tw=ts/1000;draw();requestAnimationFrame(loop)}
window.addEventListener('resize',fit);
mkStars();fit();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
