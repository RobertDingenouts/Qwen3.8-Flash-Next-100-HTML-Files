<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Slow Zine · Nº 076</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#e8e4da;color:#222;font-family:"Courier New",ui-monospace,monospace}
body{display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px}
header{text-align:center}
h1{font-size:12px;letter-spacing:.42em;text-transform:uppercase}
.tag{font-size:8px;letter-spacing:.3em;text-transform:uppercase;color:#8a7f6f;margin-top:5px}
#zine{position:relative;width:min(680px,94vw);flex:1;min-height:0;perspective:1200px}
.page{position:absolute;inset:0;background:#f2eee4;border:1px solid #c8c0b0;
display:flex;transition:transform .7s cubic-bezier(.6,0,.3,1),opacity .5s;transform-origin:left center;
box-shadow:0 12px 30px -16px rgba(0,0,0,0.4)}
.page.hide{transform:rotateY(-120deg);opacity:0;pointer-events:none}
.page .col{flex:1;padding:22px;overflow:hidden;position:relative}
.page .col+.col{border-left:1px dashed #b8ae9c}
.page h2{font-size:min(30px,5.5vw);line-height:1.05;font-weight:700;text-transform:uppercase;letter-spacing:-.01em}
.page h2 span.r{color:#d33}
.page h2 span.b{color:#2b4fb5}
.page p{font-size:min(11px,2.6vw);line-height:1.9;margin-top:12px}
.page .num{position:absolute;bottom:14px;font-size:9px;letter-spacing:.3em;color:#8a7f6f}
.page canvas.art{width:100%;height:46%;object-fit:cover;margin-bottom:10px;mix-blend-mode:multiply;image-rendering:pixelated}
.dock{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
button{font:700 8px "Courier New",monospace;letter-spacing:.2em;text-transform:uppercase;padding:10px 13px;
background:transparent;border:1px solid #222;cursor:pointer}
button:hover{background:#222;color:#f2eee4}
label{font-size:8px;letter-spacing:.2em;text-transform:uppercase;display:flex;gap:7px;align-items:center}
input[type=range]{width:80px;accent-color:#d33}
#pg{font-size:9px;letter-spacing:.2em}
@media(max-width:560px){.page .col+.col{display:none}}
</style>
</head>
<body>
<header><h1>S L O W · Z I N E</h1><p class="tag">Nº 076 · issue one — printed in two inks and one opinion</p></header>
<div id="zine"></div>
<div class="dock">
<button id="prev">◂ turn</button>
<span id="pg"></span>
<button id="next">turn ▸</button>
<label>grain <input id="grain" type="range" min="3" max="9" value="5"></label>
</div>
<script>
(function(){
"use strict";
var PAGES=[
{t:'against<br><span class="r">speed</span>',
a:'The feed loads everything and means nothing. A zine weighs ninety grams and asks for twenty minutes of your useless, beautiful life. There is no algorithm deciding which page you see next. The algorithm is your thumb.',
b:'We print two inks because constraint is a personality. Red cannot be red until blue admits where it stopped. Every misregistration is a signature the photocopier cannot forge.',art:'sun'},
{t:'on<br><span class="b">margins</span>',
a:'The blank margin is not wasted paper. It is the room your thoughts take to argue back. Fill it and the text becomes furniture; leave it and the page becomes a bench.',
b:'Halftone is honesty enlarged: every image confesses that it is dots. Watch the slider make the lie visible — at three, the photo holds; at nine, only the newspaper truth remains.',art:'wave'},
{t:'in defence of<br><span class="r">the</span> <span class="b">damp</span>',
a:'Rain on a tin roof is a percussion section that never released an album, and nobody skipped it. Slowness is not the absence of speed; it is the presence of attention.',
b:'Fold this page four times and you hold a book. The press in your pocket prints nothing you would reread. Choose the paper that creases.',art:'rain'}
];
var zine=document.getElementById('zine'),cur=0;
function halftone(cv,mode,grain){
  var w=60,h=Math.round(60*cv.clientHeight/Math.max(1,cv.clientWidth));
  cv.width=w;cv.height=h;
  var x=cv.getContext('2d');
  var g=x.createLinearGradient(0,0,w,h);
  for(var i=0;i<h;i++)for(var j=0;j<w;j++){
    var u=j/w,v=i/h;
    var val;
    if(mode==='sun')val=Math.max(0,1-Math.hypot(u-0.65,v-0.32)*2.2)+(v>0.72?0.55:0);
    else if(mode==='wave')val=0.5+0.5*Math.sin(u*9+Math.sin(v*5)*2.2);
    else val=(Math.sin(u*4+v*9)>0.72?0.85:0)+0.12*(1-v);
    val=Math.max(0,Math.min(1,val));
    var r=grain/2*(val*0.92+0.06);
    var cx=j*grain*0.5+grain*0.25,cy=i*grain*0.5+grain*0.25;
    x.fillStyle='rgba(211,34,34,'+(0.35+val*0.55)+')';
    x.fillRect(cx,cy,Math.max(0.6,r),Math.max(0.6,r));
    x.fillStyle='rgba(43,79,181,'+(0.25+(1-val)*0.4)+')';
    x.fillRect(cx+1,cy+1,Math.max(0.6,r*0.7),Math.max(0.6,r*0.7));
  }
}
function build(){
  zine.innerHTML='';
  PAGES.forEach(function(p,i){
    var d=document.createElement('div');
    d.className='page';
    d.innerHTML='<div class="col"><canvas class="art"></canvas><h2>'+p.t+'</h2><p>'+p.a+'</p>'+
      '<span class="num">0'+(i*2+1)+' · SLOW ZINE</span></div>'+
      '<div class="col"><h2 style="font-size:14px">'+p.t+'</h2><p>'+p.b+'</p>'+
      '<span class="num">0'+(i*2+2)+' · issue one</span></div>';
    d.style.zIndex=PAGES.length-i;
    zine.appendChild(d);
    halftone(d.querySelector('canvas'),p.art,+document.getElementById('grain').value);
  });
  show();
}
function show(){
  var pages=zine.children;
  for(var i=0;i<pages.length;i++)pages[i].classList.toggle('hide',i<cur);
  document.getElementById('pg').textContent=(cur+1)+' / '+PAGES.length;
}
document.getElementById('next').addEventListener('click',function(){
  if(cur<PAGES.length-1){
    zine.children[cur].style.zIndex=99;
    cur++;
    setTimeout(show,20);
  }
});
document.getElementById('prev').addEventListener('click',function(){
  if(cur>0){cur--;show();}
});
document.getElementById('grain').addEventListener('input',function(e){
  var cs=zine.querySelectorAll('canvas');
  PAGES.forEach(function(p,i){halftone(cs[i],p.art,+e.target.value)});
});
window.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight')document.getElementById('next').click();
  if(e.key==='ArrowLeft')document.getElementById('prev').click();
});
window.addEventListener('resize',build);
build();
})();
</script>
</body>
</html>
