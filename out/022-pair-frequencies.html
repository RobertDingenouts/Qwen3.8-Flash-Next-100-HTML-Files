<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pair Frequencies · Nº 022</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#0b0b0d;color:#f2f2f2;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:12px}
header{width:min(460px,96vw);display:flex;justify-content:space-between;align-items:flex-end}
h1{font-size:11px;font-weight:900;letter-spacing:.3em;text-transform:uppercase}
h1 i{font-style:normal;color:#3ce6c0}
.stat{font-size:9px;letter-spacing:.24em;text-transform:uppercase;text-align:right}
.stat b{display:block;font:700 15px ui-monospace,Menlo,monospace}
#board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:min(460px,96vw)}
.card{aspect-ratio:3/4;perspective:700px;cursor:pointer}
.inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.2,.7,.2,1)}
.card.up .inner,.card.done .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:8px;display:flex;align-items:center;justify-content:center}
.back{background:#17171b;border:1px solid #2c2c33}
.back:after{content:'';width:28%;height:28%;border-radius:50%;border:1.5px solid #3a3a44}
.front{background:#101014;border:1.5px solid #3ce6c0;transform:rotateY(180deg)}
.front svg{width:72%;height:60%}
.card.done .front{border-color:#ff5b7f;box-shadow:0 0 22px rgba(255,91,127,.25)}
.card.done .front svg *{stroke:#ff5b7f}
.dock{display:flex;gap:8px;width:min(460px,96vw)}
button{flex:1;font:700 9px "Helvetica Neue",sans-serif;letter-spacing:.2em;text-transform:uppercase;padding:12px;background:transparent;border:1.5px solid #f2f2f2;color:#f2f2f2;cursor:pointer}
button:hover{background:#f2f2f2;color:#0b0b0d}
.note{font-size:8px;letter-spacing:.22em;text-transform:uppercase;opacity:.45}
@media(max-width:420px){#board{gap:6px}}
</style>
</head>
<body>
<header>
<h1>Pair <i>Frequencies</i></h1>
<div class="stat">moves<b id="mv">0</b></div>
<div class="stat">time<b id="tm">0.0s</b></div>
</header>
<div id="board"></div>
<div class="dock"><button id="new">deal again</button><span class="note" style="align-self:center">every card sings one note · matched pairs sing chords</span></div>
<script>
(function(){
"use strict";
var NOTES=[261.63,293.66,329.63,392.00,440.00,523.25,587.33,659.25];
var SHAPES=[
 '<path d="M2 20 Q 14 2 26 20 T 50 20 T 74 20" fill="none" stroke-width="4"/>',
 '<path d="M2 34 L2 6 L18 6 L18 34 L34 34 L34 6 L50 6 L50 34 L66 34 L66 6 L74 6" fill="none" stroke-width="4"/>',
 '<path d="M2 34 L22 6 L22 34 L42 6 L42 34 L62 6 L62 34 L74 14" fill="none" stroke-width="4"/>',
 '<path d="M2 34 L12 6 L22 34 L32 6 L42 34 L52 6 L62 34 L72 6" fill="none" stroke-width="4"/>',
 '<path d="M2 20 L18 20 L18 8 L30 8 L30 30 L44 30 L44 14 L58 14 L58 26 L74 26" fill="none" stroke-width="4"/>',
 '<g><circle cx="12" cy="20" r="3.4"/><circle cx="26" cy="12" r="3.4"/><circle cx="40" cy="26" r="3.4"/><circle cx="54" cy="10" r="3.4"/><circle cx="68" cy="22" r="3.4"/></g>',
 '<path d="M2 32 Q10 30 16 26 T 32 16 T 56 8 T 74 4" fill="none" stroke-width="4"/>',
 '<path d="M8 20 a10 14 0 1 1 10 14 M50 20 a10 14 0 1 0 -10 14" fill="none" stroke-width="4"/>'
];
var AC=null;
function ac(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();return AC}
function tone(freq,when,dur,vol){
  var a=ac(),o=a.createOscillator(),g=a.createGain();
  o.type='sine';o.frequency.value=freq;
  g.gain.setValueAtTime(0,when);
  g.gain.linearRampToValueAtTime(vol||0.12,when+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,when+(dur||0.5));
  o.connect(g);g.connect(a.destination);
  o.start(when);o.stop(when+(dur||0.5)+0.05);
}
var board=document.getElementById('board'),deck,open=[],lock=false,moves=0,startT=0,timer;
var mvEl=document.getElementById('mv'),tmEl=document.getElementById('tm');
function deal(){
  board.innerHTML='';open=[];lock=false;moves=0;startT=0;
  mvEl.textContent=0;tmEl.textContent='0.0s';
  clearInterval(timer);
  var ids=[];
  for(var i=0;i<8;i++)ids.push(i,i);
  for(var k=ids.length-1;k>0;k--){var j=(Math.random()*(k+1))|0;var t=ids[k];ids[k]=ids[j];ids[j]=t}
  deck=ids.map(function(id,idx){
    var card=document.createElement('div');card.className='card';
    card.innerHTML='<div class="inner"><div class="face back"></div><div class="face front"><svg viewBox="0 0 76 40" fill="none" stroke="#3ce6c0" stroke-linecap="round" stroke-linejoin="round">'+SHAPES[id]+'</svg></div></div>';
    card.dataset.id=id;
    card.addEventListener('click',function(){flip(card)});
    board.appendChild(card);
    return card;
  });
}
function flip(card){
  if(lock||card.classList.contains('up')||card.classList.contains('done'))return;
  if(!startT){startT=performance.now();
    timer=setInterval(function(){tmEl.textContent=((performance.now()-startT)/1000).toFixed(1)+'s'},100)}
  ac().resume&&ac().resume();
  var id=+card.dataset.id;
  tone(NOTES[id],ac().currentTime,0.6,0.1);
  card.classList.add('up');
  open.push(card);
  if(open.length===2){
    moves++;mvEl.textContent=moves;
    lock=true;
    var a=open[0],b=open[1];
    if(a.dataset.id===b.dataset.id){
      setTimeout(function(){
        a.classList.add('done');b.classList.add('done');
        var when=ac().currentTime,base=NOTES[+a.dataset.id];
        tone(base,when,0.9,0.09);tone(base*1.5,when+0.08,0.9,0.07);tone(base*2,when+0.16,1.2,0.05);
        open=[];lock=false;
        if(board.querySelectorAll('.done').length===16){
          clearInterval(timer);
          setTimeout(function(){
            var t=(performance.now()-startT)/1000;
            [261.63,329.63,392,523.25].forEach(function(f,i){tone(f,ac().currentTime+i*0.12,0.8,0.09)});
            tmEl.textContent=t.toFixed(1)+'s ✓';
          },500);
        }
      },380);
    }else{
      setTimeout(function(){a.classList.remove('up');b.classList.remove('up');open=[];lock=false},820);
    }
  }
}
document.getElementById('new').addEventListener('click',deal);
deal();
})();
</script>
</body>
</html>
