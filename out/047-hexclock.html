<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hex Clock · Nº 047</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#07090c;color:#c8d6cf;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
transition:background 1s linear}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:16px}
h1{font-size:9px;letter-spacing:.5em;text-transform:uppercase;opacity:.6}
#big{font-size:min(16vw,86px);letter-spacing:.02em;display:flex;gap:min(1.4vw,10px);cursor:pointer;
user-select:none}
.dg{padding:.05em .12em;border:1.5px solid;border-radius:8px;transition:all .6s}
.bars{display:flex;flex-direction:column;gap:12px;width:min(86vw,460px)}
.bar{display:grid;grid-template-columns:26px 1fr 52px;gap:10px;align-items:center;font-size:11px;letter-spacing:.2em}
.bar i{font-style:normal;opacity:.7}
.track{height:9px;background:rgba(255,255,255,0.06);border-radius:5px;overflow:hidden}
.track div{height:100%;border-radius:5px;transition:width .3s ease}
.bar b{text-align:right;font-weight:400}
#name{font-size:11px;letter-spacing:.32em;text-transform:uppercase;opacity:.75;height:14px}
.foot{display:flex;gap:14px;font-size:9px;letter-spacing:.3em;text-transform:uppercase;opacity:.55}
@media(max-width:480px){.bars{width:92vw}}
</style>
</head>
<body>
<h1>hex clock — the day as a color</h1>
<div id="big"><span class="dg"></span><span class="dg"></span><span class="dg" style="opacity:.4">:</span><span class="dg"></span><span class="dg"></span><span class="dg" style="opacity:.4">:</span><span class="dg"></span><span class="dg"></span></div>
<div class="bars">
<div class="bar"><i>R</i><div class="track"><div id="tr"></div></div><b id="vr"></b></div>
<div class="bar"><i>G</i><div class="track"><div id="tg"></div></div><b id="vg"></b></div>
<div class="bar"><i>B</i><div class="track"><div id="tb"></div></div><b id="vb"></b></div>
</div>
<p id="name"></p>
<div class="foot"><span>hh:mm:ss → rr:gg:bb</span><span id="copied">tap the hex to copy it</span></div>
<script>
(function(){
"use strict";
var dgs=document.querySelectorAll('.dg'),
 tr=document.getElementById('tr'),tg=document.getElementById('tg'),tb=document.getElementById('tb'),
 vr=document.getElementById('vr'),vg=document.getElementById('vg'),vb=document.getElementById('vb'),
 name=document.getElementById('name'),big=document.getElementById('big'),copied=document.getElementById('copied');
var lastName='';
function hx(n){return ('0'+n.toString(16)).slice(-2)}
function hueName(h,s,l){
  if(l<0.12)return 'almost black';
  if(l>0.92)return 'almost white';
  if(s<0.14)return l>0.6?'cool chalk':'gunmetal slate';
  if(h<15||h>=345)return 'ember red';
  if(h<40)return 'burnt amber';
  if(h<65)return 'brass gold';
  if(h<90)return 'citron';
  if(h<150)return 'moss green';
  if(h<190)return 'sea teal';
  if(h<230)return 'cobalt';
  if(h<270)return 'deep indigo';
  if(h<310)return 'violet wine';
  return 'magenta dusk';
}
function rgb2hsl(r,g,b){
  r/=255;g/=255;b/=255;
  var mx=Math.max(r,g,b),mn=Math.min(r,g,b),h=0,s=0,l=(mx+mn)/2,d=mx-mn;
  if(d){
    s=d/(1-Math.abs(2*l-1));
    if(mx===r)h=60*(((g-b)/d)%6);
    else if(mx===g)h=60*((b-r)/d+2);
    else h=60*((r-g)/d+4);
  }
  return[(h+360)%360,s,l];
}
function tick(){
  var d=new Date();
  var hh=d.getHours(),mm=d.getMinutes(),ss=d.getSeconds();
  var hex=hx(hh)+hx(mm)+hx(ss);
  var str=hex.toUpperCase().split('');
  var k=0;
  dgs.forEach(function(el){
    var txt=str[k]||':';
    if(el.textContent!==txt){
      el.textContent=txt;
      el.style.transform='translateY(-3px)';
      setTimeout(function(){el.style.transform=''},240);
    }
    if(txt!==':'){
      var hue=k/8*360;
      el.style.color='hsl('+hue+',70%,65%)';
      el.style.borderColor='hsla('+hue+',70%,50%,0.5)';
      el.style.textShadow='0 0 18px hsla('+hue+',80%,60%,0.55)';
    }
    k++;
  });
  var r=hh,g=mm,b=ss;
  tr.style.width=(r/23*100)+'%';
  tg.style.width=(g/59*100)+'%';
  tb.style.width=(b/59*100)+'%';
  tr.style.background='linear-gradient(90deg,#400,'+hx(r)+' 0)';
  tr.style.background=hx(r);tr.style.backgroundImage='linear-gradient(90deg,rgba(0,0,0,0.5),'+hx(r)+')';
  tg.style.backgroundImage='linear-gradient(90deg,rgba(0,0,0,0.5),'+hx(g)+')';
  tb.style.backgroundImage='linear-gradient(90deg,rgba(0,0,0,0.5),'+hx(b)+')';
  vr.textContent=r;vg.textContent=g;vb.textContent=b;
  var hsl=rgb2hsl(r,g,b);
  var nm=hueName(hsl[0],hsl[1],hsl[2]);
  if(nm!==lastName){name.textContent='now: '+nm;lastName=nm}
  var l=hsl[2];
  document.body.style.background='hsl('+Math.round(hsl[0])+','+Math.round(hsl[1]*40)+'%,'+Math.round(4+l*9)+'%)';
}
big.addEventListener('click',function(){
  var t=' #'+hx(new Date().getHours())+hx(new Date().getMinutes())+hx(new Date().getSeconds());
  function done(){copied.textContent='copied'+t.trim()+' ✓';setTimeout(function(){copied.textContent='tap the hex to copy it'},1600)}
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done,fb);
    else fb();
  }catch(e){fb()}
  function fb(){
    var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);
    ta.select();try{document.execCommand('copy')}catch(e){}
    document.body.removeChild(ta);done();
  }
});
tick();setInterval(tick,500);
})();
</script>
</body>
</html>
