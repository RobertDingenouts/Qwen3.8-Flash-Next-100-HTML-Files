<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mood Lamp · Nº 097</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#0a0a0e;font-family:"Century Gothic",Futura,Avenir,sans-serif}
canvas{position:fixed;inset:0}
#ui{position:fixed;left:0;right:0;bottom:18px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:0 10px}
#ui button{font:700 8px "Century Gothic",sans-serif;letter-spacing:.24em;text-transform:uppercase;
padding:11px 15px;background:rgba(10,10,14,0.45);border:1px solid rgba(255,255,255,0.25);
color:rgba(255,255,255,0.8);cursor:pointer;border-radius:30px;backdrop-filter:blur(6px)}
#ui button:hover,.on{background:rgba(255,255,255,0.9)!important;color:#0a0a0e!important}
#title{position:fixed;top:18px;left:0;right:0;text-align:center;pointer-events:none}
#title h1{font-size:10px;letter-spacing:.5em;text-transform:uppercase;color:rgba(255,255,255,0.65);font-weight:400}
#title p{font-size:8px;letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,0.3);margin-top:6px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title"><h1>Mood Lamp</h1><p id="cur">aurora · breathe with it</p></div>
<div id="ui"></div>
<script>
(function(){
"use strict";
var cv=document.getElementById('c'),ctx=cv.getContext('2d'),D=1,W=0,H=0;
var PRESETS=[
{n:'aurora',hues:[160,190,260],sp:0.55,blurb:'breathe with it'},
{n:'ember',hues:[12,32,345],sp:0.35,blurb:'low fire, long night'},
{n:'deep sea',hues:[210,235,180],sp:0.3,blurb:'eleven hundred metres'},
{n:'orchard',hues:[95,140,55],sp:0.45,blurb:'leaves seen from underneath'},
{n:'static rose',hues:[320,270,200],sp:0.2,blurb:'a radio between stations'}
];
var blobs=[];
function preset(i){
 cur=i;
 blobs=[];
 for(var k=0;k<5;k++){
  blobs.push({
   x:Math.random(),y:Math.random(),
   hx:(Math.random()-0.5)*0.06,hy:(Math.random()-0.5)*0.06,
   r:0.35+Math.random()*0.4,
   hue:PRESETS[i].hues[k%3]+(Math.random()*24-12),
   ph:Math.random()*7
  });
 }
 document.getElementById('cur').textContent=PRESETS[i].n+' · '+PRESETS[i].blurb;
}
var cur=0;
function fit(){D=Math.min(devicePixelRatio||1,2);
 W=innerWidth;H=innerHeight;
 cv.width=W*D;cv.height=H*D;
 ctx.setTransform(D,0,0,D,0,0);}
function loop(ts){
 var t=ts/1000*PRESETS[cur].sp;
 ctx.fillStyle='rgba(10,10,14,0.08)';
 ctx.fillRect(0,0,W,H);
 blobs.forEach(function(b){
  b.x+=b.hx*0.004+Math.sin(t+b.ph)*0.0006;
  b.y+=b.hy*0.004+Math.cos(t*0.8+b.ph)*0.0006;
  if(b.x<-0.3)b.x=1.3;if(b.x>1.3)b.x=-0.3;
  if(b.y<-0.3)b.y=1.3;if(b.y>1.3)b.y=-0.3;
  var br=(0.7+0.3*Math.sin(t*1.6+b.ph));
  var R=b.r*Math.min(W,H)*br;
  var g=ctx.createRadialGradient(b.x*W,b.y*H,0,b.x*W,b.y*H,R);
  g.addColorStop(0,'hsla('+b.hue+',80%,55%,0.14)');
  g.addColorStop(1,'hsla('+b.hue+',80%,40%,0)');
  ctx.fillStyle=g;
  ctx.fillRect(b.x*W-R,b.y*H-R,R*2,R*2);
 });
 ctx.globalCompositeOperation='lighter';
 ctx.fillStyle='rgba(0,0,0,0)';
 ctx.globalCompositeOperation='source-over';
 requestAnimationFrame(loop);
}
var ui=document.getElementById('ui');
PRESETS.forEach(function(p,i){
 var b=document.createElement('button');
 b.textContent=p.n;
 if(i===0)b.className='on';
 b.addEventListener('click',function(){
  document.querySelectorAll('#ui button').forEach(function(x,k){x.className=k===i?'on':''});
  ctx.fillStyle='#0a0a0e';ctx.fillRect(0,0,W,H);
  preset(i);
 });
 ui.appendChild(b);
});
window.addEventListener('resize',fit);
preset(0);fit();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
