<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kepler Weather · Nº 070</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow-x:hidden;background:#f2e7d5;color:#2e3440;font-family:"Century Gothic",Futura,Avenir,sans-serif}
body{display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px}
header{display:flex;gap:18px;align-items:baseline;flex-wrap:wrap;justify-content:center}
h1{font-size:14px;font-weight:700;letter-spacing:.22em;text-transform:uppercase}
h1 b{color:#e2793c}
#clock{font:700 11px ui-monospace,Menlo,monospace;letter-spacing:.16em;color:#e2793c}
#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:min(900px,96vw)}
.card{background:#fffaf0;border:2px solid #2e3440;border-radius:10px;padding:14px;
box-shadow:4px 4px 0 #2e3440}
.card h2{font-size:9px;letter-spacing:.26em;text-transform:uppercase;color:#7c8698;margin-bottom:8px}
.card .big{font:700 clamp(22px,4vw,34px)/1 ui-monospace,Menlo,monospace;color:#2e3440}
.card .big small{font-size:40%;color:#e2793c}
canvas{display:block;width:100%}
.card p{font-size:9px;letter-spacing:.1em;color:#7c8698;margin-top:6px}
#temp{grid-column:span 2}
#bar{height:14px;background:#eee1cb;border-radius:7px;overflow:hidden;margin-top:8px}
#bar div{height:100%;background:#e2793c;transition:width .8s}
button{font:700 8px "Century Gothic",sans-serif;letter-spacing:.22em;text-transform:uppercase;
padding:10px 16px;background:transparent;border:2px solid #2e3440;color:#2e3440;cursor:pointer}
button:hover{background:#e2793c;border-color:#e2793c;color:#fff}
@media(max-width:640px){#grid{grid-template-columns:1fr 1fr}#temp{grid-column:span 2}}
</style>
</head>
<body>
<header>
<h1>Kepler <b>Weather</b></h1>
<span id="clock">SOL 0 · 00:00</span>
</header>
<div id="grid">
<div class="card" id="temp"><h2>surface temperature · 24 h trace</h2><canvas id="tchart" height="120"></canvas></div>
<div class="card"><h2>wind</h2><canvas id="rose" height="150"></canvas><p id="windp">—</p></div>
<div class="card"><h2>pressure</h2><canvas id="gauge" height="120"></canvas><p id="pressp">—</p></div>
<div class="card"><h2>methane rain odds</h2><div class="big" id="rain">—<small>%</small></div><div id="bar"><div></div></div><p>condensation ceiling 3.1 kbar</p></div>
<div class="card"><h2>twin moons</h2><canvas id="moons" height="100"></canvas><p>K-A rising · K-B setting</p></div>
<div class="card"><h2>advisory</h2><p id="adv" style="font-size:12px;line-height:1.7;color:#2e3440;margin-top:0">…</p></div>
</div>
<button id="refresh">refresh telemetry ▸</button>
<script>
(function(){
"use strict";
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;var t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
var seedBase=0;
var DPR=Math.min(window.devicePixelRatio||1,2);
function cv(id){
  var c=document.getElementById(id);
  var w=c.clientWidth||c.parentElement.clientWidth-28;
  var h=parseInt(c.getAttribute('height'));
  c.width=w*DPR;c.height=h*DPR;
  c.style.height=h+'px';
  var x=c.getContext('2d');
  x.setTransform(DPR,0,0,DPR,0,0);
  return{x:x,w:w,h:h};
}
function sol(){return Math.floor(Date.now()/86400000*1.5)%10000+4000}
function hourOfDay(){
  var d=new Date();
  return d.getHours()+d.getMinutes()/60;
}
function telemetry(){
  var r=rng(seedBase^ (sol()*7+Math.floor(hourOfDay())));
  var h=hourOfDay();
  var tempAt=function(t){
    return 14+9*Math.sin((t-9)/24*Math.PI*2)+ (Math.sin(t*3.7)*1.2);
  };
  var wind=r();
  var press=940+Math.round(r()*140);
  var rain=Math.round(8+r()*72);
  var windH=(r()*360);
  var windSp=(12+Math.round(r()*46));
  return{tempAt:tempAt,windH:windH,windSp:windSp,press:press,rain:rain,r:r};
}
function draw(){
  var T=telemetry();
  document.getElementById('clock').textContent='SOL '+sol()+' · '+
    ('0'+Math.floor(hourOfDay())).slice(-2)+':'+('0'+Math.floor(hourOfDay()%1*60)).slice(-2)+' LT';
  var tc=cv('tchart'),x=tc.x;
  x.clearRect(0,0,tc.w,tc.h);
  x.strokeStyle='#2e344022';
  x.beginPath();x.moveTo(0,tc.h*0.5);x.lineTo(tc.w,tc.h*0.5);x.stroke();
  x.strokeStyle='#e2793c';x.lineWidth=2.4;
  x.beginPath();
  for(var t=0;t<=24;t+=0.25){
    var v=T.tempAt(t);
    var px=t/24*tc.w;
    var py=tc.h-10-((v+2)/28)*(tc.h-20);
    t?x.lineTo(px,py):x.moveTo(px,py);
  }
  x.stroke();
  var nowX=hourOfDay()/24*tc.w;
  x.strokeStyle='#2e3440';x.setLineDash([3,4]);
  x.beginPath();x.moveTo(nowX,0);x.lineTo(nowX,tc.h);x.stroke();
  x.setLineDash([]);
  var nowv=Math.round(T.tempAt(hourOfDay())*10)/10;
  x.fillStyle='#2e3440';
  x.font='700 22px ui-monospace,monospace';
  x.fillText(nowv+'°',nowX+6>tc.w-70?nowX-76:nowX+6,22);
  x.font='9px ui-monospace,monospace';
  x.fillStyle='#7c8698';
  x.fillText('00h',2,tc.h-2);x.fillText('12h',tc.w/2-8,tc.h-2);x.fillText('24h',tc.w-20,tc.h-2);
  var rc=cv('rose'),rx=rc.x;
  rx.clearRect(0,0,rc.w,rc.h);
  var cx=rc.w/2,cy=rc.h/2,R=Math.min(rc.w,rc.h)*0.38;
  rx.strokeStyle='#2e344033';
  rx.beginPath();rx.arc(cx,cy,R,0,7);rx.stroke();
  rx.beginPath();rx.arc(cx,cy,R*0.6,0,7);rx.stroke();
  ['N','E','S','W'].forEach(function(l,i){
    var a=i*Math.PI/2-Math.PI/2;
    rx.fillStyle='#7c8698';rx.font='9px ui-monospace,monospace';
    rx.fillText(l,cx+Math.cos(a)*(R+10)-3,cy+Math.sin(a)*(R+10)+3);
  });
  var a=T.windH*Math.PI/180-Math.PI/2;
  rx.strokeStyle='#e2793c';rx.lineWidth=3;rx.lineCap='round';
  rx.beginPath();rx.moveTo(cx-Math.cos(a)*R*0.5,cy-Math.sin(a)*R*0.5);
  rx.lineTo(cx+Math.cos(a)*R*0.85,cy+Math.sin(a)*R*0.85);rx.stroke();
  rx.fillStyle='#e2793c';
  rx.beginPath();rx.arc(cx+Math.cos(a)*R*0.85,cy+Math.sin(a)*R*0.85,5,0,7);rx.fill();
  document.getElementById('windp').textContent=T.windSp+' m/s from '+Math.round(T.windH)+'° · gusting '+(T.windSp+9);
  var gc=cv('gauge'),gx=gc.x;
  gx.clearRect(0,0,gc.w,gc.h);
  var gx0=gc.w/2,gy0=gc.h*0.85,gR=Math.min(gc.w/2-10,gc.h*0.75);
  gx.strokeStyle='#2e344022';gx.lineWidth=8;
  gx.beginPath();gx.arc(gx0,gy0,gR,Math.PI,0);gx.stroke();
  var frac=(T.press-900)/200;frac=Math.max(0,Math.min(1,frac));
  var grad=gx.createLinearGradient(0,0,gc.w,0);
  grad.addColorStop(0,'#3f8f7a');grad.addColorStop(1,'#e2793c');
  gx.strokeStyle=grad;
  gx.beginPath();gx.arc(gx0,gy0,gR,Math.PI,Math.PI+Math.PI*frac);gx.stroke();
  var na=Math.PI+Math.PI*frac;
  gx.strokeStyle='#2e3440';gx.lineWidth=2.5;
  gx.beginPath();gx.moveTo(gx0,gy0);
  gx.lineTo(gx0+Math.cos(na)*gR*0.75,gy0+Math.sin(na)*gR*0.75);gx.stroke();
  gx.fillStyle='#2e3440';gx.font='700 16px ui-monospace,monospace';
  gx.textAlign='center';
  gx.fillText(T.press+' mbar',gx0,gy0-4);gx.textAlign='left';
  document.getElementById('pressp').textContent='falling 0.6 mbar/h';
  document.getElementById('rain').innerHTML=T.rain+'<small>%</small>';
  document.querySelector('#bar div').style.width=T.rain+'%';
  var mc=cv('moons'),mx=mc.x;
  mx.clearRect(0,0,mc.w,mc.h);
  var horizon=mc.h-16;
  mx.fillStyle='#2e3440';
  mx.fillRect(0,horizon,mc.w,2);
  [[0.65,10,45],[0.3,6,70]].forEach(function(M,i){
    var ph=(Date.now()/(86400000*M[2])%1)*Math.PI;
    var px=mc.w*(0.15+ (i? (1-(Date.now()/(86400000*M[2])%1)) : (Date.now()/(86400000*M[2])%1)))*0.7;
    var py=horizon-Math.sin(ph*(0.3+0.6*((Date.now()/(86400000*M[2]))%1)))*horizon*0.7;
    mx.fillStyle=i?'#9fb8a8':'#c9a26a';
    mx.shadowColor=mx.fillStyle;mx.shadowBlur=10;
    mx.beginPath();mx.arc(px,py,M[1],0,7);mx.fill();
    mx.shadowBlur=0;
  });
  var advs=[
    'Suit up: methane drizzle expected near the northern glass.',
    'Fair. The dunes are walking east at 14 m/s — mind the rover.',
    'Pressure trough inbound. Kite-anchor the hab and enjoy the show.',
    'Both moons overhead. Officially a festival. Bring electrolytes.'
  ];
  document.getElementById('adv').textContent=advs[sol()%4];
}
document.getElementById('refresh').addEventListener('click',function(){
  seedBase=(Math.random()*1e9)|0;draw();
});
window.addEventListener('resize',draw);
draw();
setInterval(draw,30000);
})();
</script>
</body>
</html>
