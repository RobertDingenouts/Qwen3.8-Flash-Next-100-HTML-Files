<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grid Reveal · Nº 044</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#1d1a26;color:#e6e2f0;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:10px}
header{text-align:center}
h1{font-size:11px;font-weight:800;letter-spacing:.4em;text-transform:uppercase}
h1 b{color:#f0c419}
.tag{font:8px ui-monospace,Menlo,monospace;letter-spacing:.28em;text-transform:uppercase;color:#6f6790;margin-top:6px}
#boardwrap{position:relative}
canvas{touch-action:none;cursor:crosshair}
.dock{display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:center}
button{font:700 8px "Helvetica Neue",sans-serif;letter-spacing:.2em;text-transform:uppercase;padding:10px 13px;background:transparent;border:1px solid #57507a;color:#e6e2f0;cursor:pointer}
button:hover{background:#f0c419;color:#1d1a26;border-color:#f0c419}
button.mode{background:#57507a}
#msg{font-size:10px;letter-spacing:.12em;min-height:14px;color:#9c93c4;text-align:center}
#mist{font:700 11px ui-monospace,monospace;color:#ff7a7a;min-width:60px;text-align:center}
@media(max-width:520px){h1{font-size:9px}}
</style>
</head>
<body>
<header><h1>Grid <b>Reveal</b></h1><p class="tag">Nº 044 · the numbers know the picture before you do</p></header>
<div id="boardwrap"><canvas id="c"></canvas></div>
<div class="dock">
<button id="mX" class="mode">mark ✕</button>
<button id="hint">glimpse</button>
<button id="nextp">next picture</button>
<button id="clr">clear</button>
<span id="mist">0 ✕</span>
</div>
<p id="msg">left-drag paints squares · right-drag (or MARK ✕ mode) dots the dead ones</p>
<script>
(function(){
"use strict";
var PICS=[
['..######..','#........#','#.######.#','#.#....#.#','#.#.##.#.#','#.#.##.#.#','#.#....#.#','#.######.#','#........#','..######..'],
['....##....','...####...','..######..','.########.','.########.','#.######.#','..####....','...##.....','...##.....','..######..'],
['..#....#..','..#....#..','##########','#.######.#','#........#','#..####..#','#........#','##########','..#....#..','..#....#..'],
['...####...','..######..','.########.','#..#..#..#','#..#..#..#','.########.','..######..','...####...','..######..','.#......#.'],
['#####.....','#####.....','..###.....','..#####...','......###.','.#########','##...##...','#.####....','#.#.#.....','###.##....'],
['###..##...','###.####..','..######..','..######..','.########.','.########.','..######..','...####...','....##....','...####...'],
['....##....','...####...','#..####..#','##########','##..##..##','#..####..#','#.######.#','##########','#........#','.#......#.'],
['...####...','..######..','.########.','.##.##.##.','.########.','.########.','.########.','.########.','.########.','..######..']
];
var N=10,g,st,pc,rowsH=[],colsH=[],cell=0,BW=0,mist=0,mode='paint';
var cv=document.getElementById('c'),ctx=cv.getContext('2d'),D=1;
var msg=document.getElementById('msg'),mistEl=document.getElementById('mist');
function fit(){
  D=Math.min(window.devicePixelRatio||1,2);
  var label=Math.round(Math.min(innerWidth,innerHeight-210)/24);
  cell=Math.min(Math.floor((Math.min(innerWidth-20,innerHeight-220)-label)/N),44);
  cell=Math.max(20,cell);
  BW=label+N*cell;
  cv.style.width=BW+'px';cv.style.height=BW+'px';
  cv.width=BW*D;cv.height=BW*D;ctx.setTransform(D,0,0,D,0,0);
  draw();
}
function runs(arr){
  var out=[],c=0;
  arr.forEach(function(v){if(v)c++;else if(c){out.push(c);c=0}});
  if(c)out.push(c);
  return out.length?out:[0];
}
function load(pi){
  pc=PICS[pi%PICS.length];
  g=[];st=[];
  for(var r=0;r<N;r++){
    g.push(pc[r].split('').map(function(ch){return ch==='#'?1:0}));
    st.push(new Array(N).fill(0));
  }
  rowsH=[];colsH=[];
  for(r=0;r<N;r++)rowsH.push(runs(g[r]));
  for(var c=0;c<N;c++)colsH.push(runs(g.map(function(row){return row[c]})));
  mist=0;mistEl.textContent='0 ✕';
  msg.textContent='left-drag paints squares · right-drag (or MARK ✕ mode) dots the dead ones';
}
function draw(){
  var label=Math.round(Math.min(innerWidth,innerHeight-210)/24);
  ctx.fillStyle='#1d1a26';ctx.fillRect(0,0,BW,BW);
  var i,j;
  ctx.fillStyle='#9c93c4';
  ctx.font='700 '+Math.round(label*0.55)+'px ui-monospace,monospace';
  for(i=0;i<N;i++){
    var txt=rowsH[i].join(' ');
    ctx.textAlign='right';ctx.textBaseline='middle';
    ctx.fillText(txt,label-6,label+i*cell+cell/2);
    var ct=colsH[i].join(' '),lines=ct.split(' ');
    ctx.textAlign='center';
    for(j=0;j<lines.length;j++)
      ctx.fillText(lines[j],label+i*cell+cell/2,BW-cell*0.12-(lines.length-1-j)*label*0.5);
  }
  var ox=label,oy=0;
  for(i=0;i<N;i++)for(j=0;j<N;j++){
    var x=ox+j*cell,y=i*cell;
    var filled=st[i][j]===1;
    ctx.fillStyle=filled?'#f0c419':'#2b2738';
    ctx.fillRect(x+1,y+1,cell-2,cell-2);
    if(st[i][j]===2){
      ctx.fillStyle='rgba(156,147,196,0.8)';
      ctx.beginPath();ctx.arc(x+cell/2,y+cell/2,cell*0.12,0,7);ctx.fill();
    }
    if((i+j)%2===0&&!filled){
      ctx.fillStyle='rgba(255,255,255,0.015)';
      ctx.fillRect(x+1,y+1,cell-2,cell-2);
    }
    if(i%5===4||j%5===4){
      ctx.strokeStyle='rgba(230,226,240,0.22)';
      ctx.beginPath();
      ctx.moveTo(x+1,y+cell-1);ctx.lineTo(x+cell-1,y+cell-1);
      ctx.moveTo(x+cell-1,y+1);ctx.lineTo(x+cell-1,y+cell-1);
      ctx.stroke();
    }
  }
}
function cellAt(x,y){
  var label=Math.round(Math.min(innerWidth,innerHeight-210)/24);
  var j=Math.floor((x-label)/cell),i=Math.floor(y/cell);
  if(i<0||i>=N||j<0||j>=N)return null;
  return[i,j];
}
function apply(x,y,fill){
  var c=cellAt(x,y);
  if(!c)return;
  var nv=fill?1:2;
  if(st[c[0]][c[1]]===nv)return;
  st[c[0]][c[1]]=nv;
  if(!check())countMist();
  else win();
  draw();
}
function countMist(){
  var m=0;
  for(var i=0;i<N;i++)for(var j=0;j<N;j++)
    if(st[i][j]===1&&g[i][j]===0)m++;
  mist=m;mistEl.textContent=m+' ✕';
}
function check(){
  for(var i=0;i<N;i++)for(var j=0;j<N;j++)
    if(st[i][j]!==2&&st[i][j]!==g[i][j])return false;
  return true;
}
function win(){
  msg.textContent='revealed! the grid was holding ‘picture '+(PICS.indexOf(pc)+1)+'’ all along.';
  msg.style.color='#f0c419';
  setTimeout(function(){msg.style.color=''},1200);
}
var down=false,btn=0;
cv.addEventListener('pointerdown',function(e){
  down=true;
  btn=(e.button===2||mode==='x')?0:1;
  var r=cv.getBoundingClientRect();
  apply(e.clientX-r.left,e.clientY-r.top,btn===1);
});
cv.addEventListener('pointermove',function(e){
  if(!down)return;
  var r=cv.getBoundingClientRect();
  apply(e.clientX-r.left,e.clientY-r.top,btn===1);
},{passive:true});
window.addEventListener('pointerup',function(){down=false});
cv.addEventListener('contextmenu',function(e){e.preventDefault()});
document.getElementById('mX').addEventListener('click',function(){
  mode=mode==='paint'?'x':'paint';
  this.classList.toggle('mode',mode==='x');
  this.textContent=mode==='x'?'paint ■':'mark ✕';
});
document.getElementById('hint').addEventListener('click',function(){
  var spots=[];
  for(var i=0;i<N;i++)for(var j=0;j<N;j++)
    if(st[i][j]===0)spots.push([i,j]);
  if(!spots.length)return;
  var s=spots[(Math.random()*spots.length)|0];
  st[s[0]][s[1]]=g[s[0]][s[1]];
  countMist();draw();
});
document.getElementById('nextp').addEventListener('click',function(){load((PICS.indexOf(pc)+1)%PICS.length);draw()});
document.getElementById('clr').addEventListener('click',function(){
  for(var i=0;i<N;i++)st[i].fill(0);countMist();draw();
});
window.addEventListener('resize',fit);
load(0);fit();
})();
</script>
</body>
</html>
