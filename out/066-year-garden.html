<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Year Garden · Nº 066</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#f2efe6;color:#33402e;font-family:Optima,Candara,"Gill Sans",sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:14px}
header{text-align:center}
h1{font:italic 400 24px Georgia,serif}
.tag{font:9px ui-monospace,Menlo,monospace;letter-spacing:.32em;text-transform:uppercase;color:#8a937d;margin-top:5px}
#grid{display:grid;grid-template-columns:34px repeat(31,1fr);gap:3px;align-items:center;
width:min(920px,96vw)}
.mlab{font-size:8px;letter-spacing:.18em;text-transform:uppercase;color:#8a937d;text-align:right;padding-right:4px}
.d{aspect-ratio:1;border-radius:50%;cursor:crosshair;transition:transform .12s}
.d:hover{transform:scale(1.5)}
.d.void{visibility:hidden}
#tip{font:italic 13px Georgia,serif;height:18px;color:#5f7050;text-align:center}
#prog{font:700 11px ui-monospace,Menlo,monospace;letter-spacing:.14em;color:#5f7050}
@media(max-width:640px){#grid{gap:2px;grid-template-columns:26px repeat(31,1fr)}.mlab{font-size:6px}}
</style>
</head>
<body>
<header><h1>Year Garden</h1><p class="tag">Nº 066 · every day of this year, quietly grown</p></header>
<div id="grid"></div>
<p id="tip">hover a day to read its almanac</p>
<p id="prog"></p>
<script>
(function(){
"use strict";
var now=new Date();
var Y=now.getFullYear();
var leap=((Y%4===0&&Y%100!==0)||Y%400===0);
var DAYS=leap?366:365;
var MLAB=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var ADJ=['radiant','stubborn','drizzly','curious','golden','quiet','restless','velvet','brisk','drowsy','bright','mossy','windward','amber','hushed','lucky'];
var NOUN=['fern','sparrow','lantern','ledger','harbour','thicket','teacup','kite','cistern','orchard','ferry','bell','lantern','cliff','meadow','kettle'];
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;var t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
var grid=document.getElementById('grid');
var todayDoy=doy(now);
function doy(d){var s=new Date(d.getFullYear(),0,0);return Math.floor((d-s)/86400000)}
for(var m=0;m<12;m++){
  var lab=document.createElement('div');lab.className='mlab';lab.textContent=MLAB[m];
  grid.appendChild(lab);
  var daysInMonth=new Date(Y,m+1,0).getDate();
  for(var d=0;d<31;d++){
    var el=document.createElement('div');
    if(d<daysInMonth){
      var doyN=doy(new Date(Y,m,d+1));
      var r=rng(doyN*7919+Y)();
      var r2=rng(doyN*104729+Y)();
      if(doyN<=todayDoy){
        var health=r;
        var hue=110+ (r-0.5)*46;
        var light=30+health*42;
        var sat=30+health*45;
        el.className='d';
        el.style.background='hsl('+hue+','+sat+'%,'+light+'%)';
        el.style.width=(40+health*60)+'%';
        el.style.height='';
        el.style.aspectRatio='1';
        el.style.margin='auto';
        if(doyN===todayDoy){el.style.boxShadow='0 0 0 2px #d8a45a, 0 0 10px 2px rgba(216,164,90,0.6)'}
        (function(n){
          el.addEventListener('mouseenter',function(){
            document.getElementById('tip').textContent='day '+n+' — ‘'+ADJ[(n*3)%16]+' '+NOUN[(n*7)%16]+'’';
          });
        })(doyN);
      }else{
        el.className='d';
        el.style.border='1px solid rgba(95,112,80,0.3)';
      }
    }else el.className='d void';
    grid.appendChild(el);
  }
}
document.getElementById('prog').textContent=
  Y+' · '+todayDoy+'/'+DAYS+' days grown — '+(100*todayDoy/DAYS).toFixed(1)+'% of the garden is in bloom';
})();
</script>
</body>
</html>
