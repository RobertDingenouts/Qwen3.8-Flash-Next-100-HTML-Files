<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pollen Stream · Nº 071</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#f4f1e4;color:#4a4a3a;font-family:Optima,Candara,"Gill Sans",sans-serif}
body{display:flex;flex-direction:column;gap:10px;padding:14px}
header{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px}
h1{font-size:14px;font-weight:400;letter-spacing:.3em;text-transform:uppercase}
h1 b{color:#7d9b6a}
.tag{font:8px ui-monospace,Menlo,monospace;letter-spacing:.26em;text-transform:uppercase;color:#98937e}
#wrap{flex:1;min-height:0;position:relative}
canvas{position:absolute;inset:0;touch-action:none}
#tip{position:fixed;background:#fffdf4;border:1px solid #b9b39a;border-radius:4px;padding:7px 10px;
font-size:10px;letter-spacing:.06em;pointer-events:none;box-shadow:0 6px 18px -6px rgba(0,0,0,0.25);display:none;z-index:5}
#tip b{font-size:11px}
.legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.lg{display:flex;gap:6px;align-items:center;font-size:9px;letter-spacing:.18em;text-transform:uppercase;cursor:pointer}
.lg i{width:14px;height:8px;border-radius:4px}
.lg.off{opacity:.35;text-decoration:line-through}
#hint{font-size:8px;letter-spacing:.24em;text-transform:uppercase;text-align:center;color:#98937e}
@media(max-width:520px){h1{font-size:11px}}
</style>
</head>
<body>
<header>
<div><h1>Pollen <b>Stream</b></h1><p class="tag">Nº 071 · a meadow year, stacked in air</p></div>
<p class="tag" id="unit">pollen grains · per cubic metre · daily mean</p>
</header>
<div id="wrap"><canvas id="c"></canvas></div>
<div class="legend" id="legend"></div>
<p id="hint">hover the stream to read the air · click a species to mute it</p>
<div id="tip"></div>
<script>
(function(){
"use strict";
var SPEC=[
{n:'Birch',c:'#8fae6b',peak:[95,30],w:34},
{n:'Grass',c:'#d8b84b',peak:[150,34],w:42},
{n:'Ragweed',c:'#c47a4a',peak:[245,26],w:30},
{n:'Olive',c:'#6f9b8f',peak:[130,20],w:16},
{n:'Cypress',c:'#5f7f9b',peak:[20,24],w:18}
];
var DAYS=365;
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;var t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
var data=SPEC.map(function(sp,si){
  var r=rng(si*991+7);
  var arr=new Float32Array(DAYS);
  for(var d=0;d<DAYS;d++){
    var dx=Math.min(Math.abs(d-sp.peak[0]),365-Math.abs(d-sp.peak[0]));
    var v=sp.w*Math.exp(-(dx*dx)/(2*sp.peak[1]*sp.peak[1]))*(0.55+0.9*r());
    arr[d]=Math.max(0,v);
  }
  return arr;
});
var cv=document.getElementById('c'),ctx=cv.getContext('2d'),D=1,W=0,H=0;
var off=SPEC.map(function(){return false});
var hoverDay=-1;
function fit(){D=Math.min(window.devicePixelRatio||1,2);
 var r=document.getElementById('wrap').getBoundingClientRect();
 W=r.width;H=r.height;
 cv.width=W*D;cv.height=H*D;ctx.setTransform(D,0,0,D,0,0);
 draw();}
function totals(){
  var t=new Float32Array(DAYS);
  SPEC.forEach(function(s,i){
    if(off[i])return;
    for(var d=0;d<DAYS;d++)t[d]+=data[i][d];
  });
  return t;
}
function draw(){
  ctx.clearRect(0,0,W,H);
  var tot=totals();
  var mx=10;
  for(var d=0;d<DAYS;d++)mx=Math.max(mx,tot[d]);
  var base=H-30;
  var x=d=>d/(DAYS-1)*W;
  var yscale=(base-20)/mx;
  var vals=SPEC.map(function(){return new Float32Array(DAYS)});
  for(d=0;d<DAYS;d++){
    var acc=0;
    for(var i=0;i<SPEC.length;i++){
      if(!off[i]){vals[i][d]=acc;acc+=data[i][d]}
      else vals[i][d]=acc;
    }
  }
  for(var i=SPEC.length-1;i>=0;i--){
    if(off[i])continue;
    ctx.beginPath();
    for(var d=0;d<DAYS;d++){
      var y=base-(vals[i][d]+data[i][d])*yscale;
      d?ctx.lineTo(x(d),y):ctx.moveTo(x(d),y);
    }
    for(d=DAYS-1;d>=0;d--)ctx.lineTo(x(d),base-vals[i][d]*yscale);
    ctx.closePath();
    ctx.fillStyle=SPEC[i].c+'cc';
    ctx.fill();
    ctx.strokeStyle=SPEC[i].c;
    ctx.lineWidth=1.2;
    ctx.stroke();
  }
  ctx.strokeStyle='rgba(74,74,58,0.25)';
  ctx.beginPath();ctx.moveTo(0,base);ctx.lineTo(W,base);ctx.stroke();
  var MON=['J','F','M','A','M','J','J','A','S','O','N','D'];
  ctx.fillStyle='#98937e';
  ctx.font='9px ui-monospace,monospace';
  for(var m=0;m<12;m++){
    var dd=[0,31,59,90,120,151,181,212,243,273,304,334][m];
    ctx.fillText(MON[m],x(dd)+2,base+14);
  }
  if(hoverDay>=0){
    ctx.strokeStyle='rgba(74,74,58,0.4)';
    ctx.setLineDash([3,4]);
    ctx.beginPath();ctx.moveTo(x(hoverDay),0);ctx.lineTo(x(hoverDay),base);ctx.stroke();
    ctx.setLineDash([]);
  }
}
var tip=document.getElementById('tip');
cv.addEventListener('pointermove',function(e){
  var r=cv.getBoundingClientRect();
  hoverDay=Math.round((e.clientX-r.left)/W*(DAYS-1));
  hoverDay=Math.max(0,Math.min(DAYS-1,hoverDay));
  var mon=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var dt=new Date(2001,0,1);dt.setDate(dt.getDate()+hoverDay);
  var html='<b>'+mon[dt.getMonth()]+' '+dt.getDate()+'</b><br>';
  var tot=0;
  SPEC.forEach(function(s,i){
    if(off[i])return;
    tot+=data[i][hoverDay];
    if(data[i][hoverDay]>0.5)html+='<span style="color:'+s.c+'">'+s.n+' '+Math.round(data[i][hoverDay])+'</span><br>';
  });
  tip.innerHTML=html+'<b>'+Math.round(tot)+' /m³</b>';
  tip.style.display='block';
  var tx=Math.min(innerWidth-150,e.clientX+14),ty=Math.min(innerHeight-110,e.clientY+12);
  tip.style.left=tx+'px';tip.style.top=ty+'px';
  draw();
});
cv.addEventListener('pointerleave',function(){hoverDay=-1;tip.style.display='none';draw()});
var leg=document.getElementById('legend');
SPEC.forEach(function(s,i){
  var d=document.createElement('div');d.className='lg';
  d.innerHTML='<i style="background:'+s.c+'"></i>'+s.n;
  d.addEventListener('click',function(){
    off[i]=!off[i];d.classList.toggle('off',off[i]);draw();
  });
  leg.appendChild(d);
});
window.addEventListener('resize',fit);
fit();
})();
</script>
</body>
</html>
